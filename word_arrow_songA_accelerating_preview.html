function note(when,n,d,kind,v){
 const a=ctx,start=a.currentTime+when;
 if(kind==='h'||kind==='s'||kind==='k')return;
 const osc=a.createOscillator(),g=a.createGain(),f=440*Math.pow(2,(n-69)/12);
