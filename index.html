<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ワードアロー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* layout: phone = one column. Tablet landscape = monster on the left, board on the right. Exam-paper (light) / blackboard (dark) */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#18242f; --ink2:#566676; --line:#cdd8e1; --grid:rgba(24,36,47,.06);
  --accent:#cf3220; --on-accent:#ffffff; --mark:rgba(255,225,77,.75); --ok:#12804f;
  --g0:#f0605a; --g1:#f3a81f; --g2:#35b27a; --g3:#4a90f2; --g4:#9a68dc;
  --f-display:'Dela Gothic One','Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1c17; --surface:#182a21; --ink:#eef3ea; --ink2:#9fb3a6; --line:#2d4538; --grid:rgba(238,243,234,.05);
    --accent:#ff7a63; --on-accent:#14201a; --mark:rgba(242,217,78,.4); --ok:#5fd69b;
    --g0:#ff7a73; --g1:#ffbf3c; --g2:#4fd093; --g3:#5ea2ff; --g4:#b184f0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1c17; --surface:#182a21; --ink:#eef3ea; --ink2:#9fb3a6; --line:#2d4538; --grid:rgba(238,243,234,.05);
  --accent:#ff7a63; --on-accent:#14201a; --mark:rgba(242,217,78,.4); --ok:#5fd69b;
  --g0:#ff7a73; --g1:#ffbf3c; --g2:#4fd093; --g3:#5ea2ff; --g4:#b184f0; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 28px; min-height:100vh;
}
#app{max-width:440px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;font-weight:900;padding:0 1px}

.btn{display:block;width:100%;border:2px solid var(--ink);background:var(--surface);border-radius:12px;padding:13px 18px;font-weight:900;font-size:17px;min-height:50px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{box-shadow:none;border-color:var(--line);color:var(--ink2);font-weight:700}
.actions{display:grid;gap:12px}
.actions.two{grid-template-columns:1fr 1fr}

/* title */
.title{display:grid;gap:20px;padding-top:12px}
.eyebrow{font-size:13px;letter-spacing:.12em;font-weight:700;color:var(--ink2)}
.title h1{font-family:var(--f-display);font-size:clamp(40px,13vw,58px);line-height:1.05;font-weight:400}
.ringed{position:relative;display:inline-block;padding:0 .12em}
.ringed svg{position:absolute;inset:-12% -8%;width:116%;height:124%;overflow:visible}
.ringed ellipse{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .9s .2s backwards}
.lead{color:var(--ink2);font-weight:500}
.gemrow{display:flex;gap:8px}
.gemrow .tile{width:48px;height:48px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:4px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-display);width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;background:var(--surface)}
.steps b{display:block;font-weight:900}
.steps span{font-size:14px;color:var(--ink2);line-height:1.5}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modebtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:2px;min-width:0}
.modebtn b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.2}
.modebtn span{font-size:13px;color:var(--ink2);font-weight:700}
.modebtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.modebtn[aria-pressed="true"] b{color:var(--accent)}
.best{font-size:14px;font-weight:700;color:var(--ink2)}
.best b{color:var(--ink)}

/* study */
.head{display:grid;gap:4px;margin-bottom:14px}
.head .eyebrow{color:var(--accent)}
.head h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2}
.cards{display:grid;gap:12px;margin-bottom:16px}
.wc{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.wc.miss{border:2px solid var(--accent)}
.wc .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.en{font-family:var(--f-display);font-size:28px;line-height:1.15;overflow-wrap:anywhere}
.pos{font-size:12px;font-weight:700;color:var(--ink2);border:1.5px solid var(--line);border-radius:99px;padding:0 9px}
.ja{font-weight:900;font-size:18px}
.ex{font-size:15px;font-weight:500}
.exj{font-size:13px;color:var(--ink2)}
.bigk{font-family:var(--f-body);font-weight:900;font-size:64px;line-height:1.05}
.kinfo{display:grid;gap:2px;min-width:0}
.tag2{font-family:var(--f-display);font-size:26px;color:var(--accent);line-height:1}
.say{margin-left:auto;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.sent-say{margin-left:0;justify-self:start;margin-top:4px}
.snd{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;color:var(--ink2)}
.sticky{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}

/* battle */
.battle{position:relative;display:grid;gap:10px;grid-template-areas:"bar" "arena" "slot" "foot"}
.bar{grid-area:bar;display:flex;align-items:baseline;gap:10px;font-size:13px;font-weight:700;color:var(--ink2)}
.bar .stg{font-family:var(--f-display);color:var(--accent);font-weight:400;letter-spacing:.04em}
.bar .stn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sc{font-variant-numeric:tabular-nums;color:var(--ink)}
.arena{grid-area:arena;display:grid;justify-items:center;gap:4px;padding:6px 0 2px}
.mon{width:min(var(--ms,120px),100%);aspect-ratio:160/134}
.mon svg{width:100%;height:100%;overflow:visible}
.mon .mo{stroke:var(--ink)}
.mon.rage svg{animation:tremble .11s linear infinite;filter:hue-rotate(-42deg) saturate(1.9) brightness(1.05) drop-shadow(0 0 8px var(--accent))}
.mon.rage .mo{stroke:#6e0d0d}
.mon.hit svg{animation:shake .4s}
.mon.laugh svg{animation:bob .5s}
.mon.boom svg{animation:boom 1.1s forwards}
.mname{font-family:var(--f-display);font-size:15px;text-align:center}
.hp{position:relative;width:min(100%,360px);height:18px;border:2px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--accent);transition:width .5s}
.hp b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
.slot{grid-area:slot;position:relative;width:100%;justify-self:center}
.pv{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 6px;overflow:hidden;aspect-ratio:6/1.45;align-content:end;margin-bottom:-2px;-webkit-mask-image:linear-gradient(to top,#000 35%,transparent 100%);mask-image:linear-gradient(to top,#000 35%,transparent 100%)}
.pcell{aspect-ratio:1;padding:3px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;min-width:0;opacity:.8}
.pcell.far{opacity:.45}
.pcell svg{width:100%;height:100%;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;padding:4px;border:2px solid var(--ink);border-radius:14px;background:var(--bg);overflow:hidden}
.cell{aspect-ratio:1;padding:3px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;min-width:0}
.cell svg{width:100%;height:100%;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;pointer-events:none}
.g0{fill:var(--g0)}.g1{fill:var(--g1)}.g2{fill:var(--g2)}.g3{fill:var(--g3)}.g4{fill:var(--g4)}
.cell.sel{outline:3px solid var(--accent);outline-offset:-3px}
.cell.fall{animation:drop .3s cubic-bezier(.3,.7,.4,1)}
.cell.pop{animation:pop .26s forwards}
.cell.jama{background:repeating-linear-gradient(135deg,var(--line) 0 5px,var(--surface) 5px 10px);border-color:var(--ink2)}
.foot{grid-area:foot;font-size:13px;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.arrow{position:absolute;width:16px;height:48px;margin:-24px 0 0 -8px}
.arrow.big{filter:drop-shadow(0 0 7px var(--accent))}
.arrow .nose,.arrow .fin{fill:var(--accent)}
.arrow .body{fill:var(--ink)}
.arrow .flame{fill:var(--g1)}
.float{position:absolute;font-family:var(--f-display);font-size:30px;color:var(--accent);transform:translate(-50%,-50%);animation:rise .9s forwards;text-shadow:0 0 6px var(--bg),0 0 6px var(--bg);white-space:nowrap}
.toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:900;font-size:14px;animation:rise 1.3s forwards;white-space:nowrap}
.ring-wave{position:absolute;border:6px solid var(--accent);border-radius:50%}
.part{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px}
.part svg{width:100%;height:100%;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.boomtxt{position:absolute;left:50%;font-family:var(--f-display);font-size:clamp(48px,13vw,96px);color:var(--accent);text-shadow:3px 3px 0 var(--ink);white-space:nowrap;transform:translate(-50%,-50%)}

/* quiz */
.quiz{display:grid;gap:12px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;font-weight:900;flex-wrap:wrap}
.tag{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 10px}
.arrows{color:var(--accent)}
.sent{font-size:19px;font-weight:700;line-height:1.7}
.blank{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--ink);margin:0 3px;vertical-align:-2px;text-align:center}
.blank.s{min-width:1.5em}
.blank.filled{color:var(--accent);font-weight:900;border-bottom-color:var(--accent)}
.blank.filled:not(.s){font-family:var(--f-display);font-size:.9em}
.bigword{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bigword .en{font-size:36px}
.qask{font-weight:700;color:var(--ink2);font-size:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.ch{position:relative;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:56px;font-weight:900;font-size:17px;text-align:center;min-width:0;overflow-wrap:anywhere}
.ch:not(:disabled):active{transform:scale(.97)}
.ch:disabled{cursor:default}
.ch .ring{position:absolute;inset:-6px -4px;width:calc(100% + 8px);height:calc(100% + 12px);pointer-events:none;overflow:visible}
.ch .ring ellipse{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .5s backwards}
.ch.wrong{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:3px;color:var(--ink2);border-style:dashed}
.ch.right{border-color:var(--accent)}
.verdict{font-family:var(--f-display);font-size:22px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--accent)}
.fb{display:grid;gap:8px}
.fb .ans{font-weight:900}
.fb .ex{background:var(--bg);border-radius:10px;padding:8px 10px}

/* review, notebook, ranking */
.rv{display:grid;gap:10px;margin-bottom:16px}
.badge{margin-left:auto;font-size:12px;font-weight:900;border-radius:99px;padding:1px 10px;border:1.5px solid var(--ok);color:var(--ok)}
.badge.ng{border-color:var(--accent);color:var(--accent)}
.bignum{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--accent)}
.sum{display:grid;gap:4px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 10px;font-weight:900;font-size:15px}
.tab[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.rk{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px}
.rk li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:baseline;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}
.rk li.me{border-color:var(--accent);border-width:2px}
.rk .no{font-family:var(--f-display);color:var(--accent)}
.rk .nm{min-width:0;overflow-wrap:anywhere}
.rk .pt{font-variant-numeric:tabular-nums}
.rk .st{font-size:12px;color:var(--ink2)}
.namebox{display:grid;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:16px}
.namebox label{font-weight:900;font-size:14px}
.namebox input{font:inherit;font-weight:700;font-size:18px;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.sec{font-size:15px;font-weight:900;margin-bottom:8px}

/* handwriting pad */
.wr{ruby-position:over}
.wr rt{font-size:.34em;font-weight:700;color:var(--ink2);letter-spacing:.06em}
.wq{font-family:var(--f-body);font-weight:900;font-size:48px;line-height:1.5}
.hole{display:inline-block;width:.95em;height:.95em;border:3px solid var(--ink);border-radius:50%;vertical-align:-.1em;margin:0 .06em;box-shadow:0 5px 0 -2px var(--accent)}
.padwrap{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;background:var(--bg);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.padwrap::before,.padwrap::after{content:"";position:absolute;pointer-events:none}
.padwrap::before{left:50%;top:0;bottom:0;border-left:2px dashed var(--line)}
.padwrap::after{top:50%;left:0;right:0;border-top:2px dashed var(--line)}
.padwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;color:var(--ink);cursor:crosshair}
.padbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,340px);margin:0 auto}
.padbar .btn{min-height:44px;font-size:15px;padding:8px 12px}
.revealrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hint{font-size:14px;font-weight:700;color:var(--ink2)}
.hint b{color:var(--ink)}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes drop{from{transform:translateY(calc(var(--f)*-112%))}to{transform:none}}
@keyframes pop{to{transform:scale(.1) rotate(40deg);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bob{50%{transform:translateY(-12px) scale(1.06)}}
@keyframes tremble{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2.5px,1px) rotate(-1.2deg)}50%{transform:translate(2px,-1.5px) rotate(1deg)}75%{transform:translate(-1.5px,-2px) rotate(-.6deg)}100%{transform:translate(2px,2px) rotate(.8deg)}}
@keyframes rise{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-34px}}
@keyframes boom{0%{transform:none;filter:none}15%{transform:translateX(-8px) rotate(-3deg);filter:brightness(2.2)}30%{transform:translateX(8px) rotate(3deg);filter:none}45%{transform:translateX(-6px) scale(1.04);filter:brightness(2.2)}70%{transform:scale(1.35);opacity:1;filter:brightness(3)}100%{transform:scale(1.7);opacity:0;filter:blur(6px) brightness(3)}}
@media (prefers-reduced-motion:reduce){
  .cell.fall,.mon.hit svg,.mon.laugh svg,.mon.rage svg,.ringed ellipse,.ch .ring ellipse{animation:none}
  .btn{transition:none}
}

/* tablet and up: use the whole screen */
@media (min-width:700px){
  body{font-size:18px}
  .padwrap,.padbar{width:min(100%,440px)}
  .wq{font-size:64px}
  .padbar .btn{font-size:17px;min-height:52px}
  .hint{font-size:17px}
  #app{max-width:1120px}
  .title{max-width:640px;margin:0 auto}
  .head h2{font-size:36px}
  .cards{grid-template-columns:1fr 1fr;gap:16px}
  .rv{grid-template-columns:1fr 1fr;gap:14px}
  .wc{padding:18px}
  .en{font-size:38px}.ja{font-size:22px}.ex{font-size:18px}.exj{font-size:15px}.pos{font-size:14px}
  .bigk{font-size:84px}.tag2{font-size:34px}
  .say{font-size:15px;padding:5px 16px}
  .sticky .btn{max-width:520px;margin:0 auto}
  .btn{font-size:20px;min-height:58px}
  .bar{font-size:17px}
  .mname{font-size:22px}
  .hp{height:26px}.hp b{font-size:14px}
  .mon{width:min(calc(var(--ms,120px)*1.5),100%,40vh)}
  .slot{width:min(100%,max(340px,calc((100vh - 360px)*.8)),680px)}
  .foot{font-size:16px}
  .quiz{padding:22px;gap:16px}
  .qhead{font-size:16px}
  .sent{font-size:28px}
  .bigword .en{font-size:54px}
  .qask{font-size:18px}
  .choices{gap:14px}
  .ch{font-size:23px;min-height:76px}
  .verdict{font-size:32px}
  .fb .ans{font-size:21px}
  .toast{font-size:18px}
  .float{font-size:44px}
  .rk{max-width:640px}
}
@media (min-width:900px) and (orientation:landscape){
  .battle{grid-template-columns:minmax(300px,1fr) auto;grid-template-areas:"bar bar" "arena slot" "foot slot";column-gap:32px;align-items:start}
  .slot{width:clamp(380px,calc((100vh - 110px)*.8),820px);justify-self:end}
  .mon{width:min(calc(var(--ms,120px)*1.9),100%)}
  .arena{align-self:center;padding-top:24px}
  .hp{width:min(100%,460px)}
}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';
var N=6;

/* ---------- storage ---------- */
function lsj(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsw(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- content ---------- */

function makePlan(m){
  var plan=[],i;
  function ids(kind){return shuffle(allCards(kind).map(function(c){return c.id}))}
  if(m==='e'){
    var history=lsj('wordarrow-recent-e',{}),e=ids('e');
    e.sort(function(a,b){return (history[a]||0)-(history[b]||0)});
    var chosen=e.slice(0,40);
    chosen.forEach(function(id){history[id]=(history[id]||0)+1});
    lsw('wordarrow-recent-e',history);
    chosen=shuffle(chosen);
    for(i=0;i<10;i++) plan.push(chosen.slice(i*4,i*4+4));
  }else{
    var ks=shuffle(allCards('k').filter(function(c){return c.advanced}).map(function(c){return c.id})).slice(0,20),os=ids('o').slice(0,10),cs=[];
    ['ア','イ','ウ','エ','オ'].forEach(function(t){
      shuffle(allCards('c').filter(function(c){return c.t===t})).slice(0,2).forEach(function(c){cs.push(c.id)});
    });
    cs=shuffle(cs);
    for(i=0;i<10;i++) plan.push([ks[i*2],ks[i*2+1],cs[i],os[i]]);
  }
  return plan;
}

var speechVoices=[];
function refreshSpeechVoices(){
  try{speechVoices=window.speechSynthesis.getVoices()||[]}catch(e){speechVoices=[]}
}
function preferredSpeechVoice(lang){
  refreshSpeechVoices();
  var target=(lang||'en-US').toLowerCase();
  var primary=target.split('-')[0];
  var candidates=speechVoices.filter(function(v){return v.lang&&v.lang.toLowerCase().split('-')[0]===primary});
  if(!candidates.length)return null;
  function rank(v){
    var code=v.lang.toLowerCase(),name=v.name||'',score=0;
    if(code===target)score+=100;
    else if(code.split('-')[0]===primary)score+=25;
    if(/premium|enhanced|neural|natural/i.test(name))score+=45;
    if(/samantha|ava|allison|susan|alex|daniel|serena|google us english|microsoft aria|microsoft jenny/i.test(name))score+=15;
    if(/compact|eloquence|novelty|robot|whisper|bad news|good news|bubbles/i.test(name))score-=80;
    return score;
  }
  candidates.sort(function(a,b){return rank(b)-rank(a)});
  return candidates[0];
}

/* English word audio: real dictionary recordings when available.
   Example sentences: optional hosted audio assets; otherwise device TTS.
   No API keys are required. */
var wordAudioCache=Object.create(null);
var currentAudio=null;
var playbackSerial=0;
function stopAudio(){
  playbackSerial++;
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
}
function speechFallback(t,locale){
  if(!('speechSynthesis' in window))return;
  var u=new SpeechSynthesisUtterance(String(t));
  u.lang=locale;
  u.rate=locale==='ja-JP'?0.9:0.94;
  u.pitch=1;
  u.volume=1;
  var voice=preferredSpeechVoice(locale);
  if(voice)u.voice=voice;
  window.speechSynthesis.speak(u);
}
async function getDictionaryAudio(word){
  var key=word.toLowerCase();
  if(Object.prototype.hasOwnProperty.call(wordAudioCache,key))return wordAudioCache[key];
  try{
    var controller=new AbortController();
    var timeout=setTimeout(function(){controller.abort()},3500);
    var response;
    try{response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key),{signal:controller.signal})}
    finally{clearTimeout(timeout)}
    if(!response.ok)throw new Error('No dictionary audio');
    var entries=await response.json(),audio='';
    for(var entry of entries){
      for(var phonetic of (entry.phonetics||[])){
        if(phonetic.audio){
          var url=new URL(phonetic.audio,location.href);
          if(url.protocol==='https:'){
            if(!audio||/us/i.test(url.pathname))audio=url.href;
            if(/us/i.test(url.pathname))break;
          }
        }
      }
      if(audio)break;
    }
    wordAudioCache[key]=audio||null;
  }catch(e){wordAudioCache[key]=null}
  return wordAudioCache[key];
}
function playAudioUrl(url,serial,fallback){
  if(serial!==playbackSerial)return;
  var audio=new Audio(url);
  currentAudio=audio;
  audio.onended=function(){if(currentAudio===audio)currentAudio=null};
  audio.onerror=function(){if(serial===playbackSerial){currentAudio=null;fallback()}};
  var result=audio.play();
  if(result&&result.catch)result.catch(function(){if(serial===playbackSerial){currentAudio=null;fallback()}});
}
async function speak(t,lang){
  if(!t)return;
  stopAudio();
  var serial=playbackSerial,locale=lang||'en-US';
  var fallback=function(){if(serial===playbackSerial)speechFallback(t,locale)};
  if(locale==='en-US'){
    var clean=String(t).trim();
    if(/^[a-z]+(?:[-'][a-z]+)*$/i.test(clean)){
      var recording=await getDictionaryAudio(clean);
      if(serial!==playbackSerial)return;
      if(recording){playAudioUrl(recording,serial,fallback);return}
    }else{
      // To use studio-recorded sentence audio, add files and a mapping
      // to window.WORD_ARROW_SENTENCE_AUDIO before this script executes.
      var mapping=window.WORD_ARROW_SENTENCE_AUDIO||{};
      var url=mapping[clean];
      if(typeof url==='string'&&/^(https:\/\/|\.\/?)/.test(url)){
        playAudioUrl(url,serial,fallback);return;
      }
    }
  }
  fallback();
}

function nbDec(card){var m=card.mode,x=NB[m][card.id];if(!x)return;x.n--;x.t=Date.now();if(x.n<=0)delete NB[m][card.id];nbSave(m)}
function nbCount(m){return Object.keys(NB[m]).filter(function(id){return BYID[id]}).length}
function record(q,ok,fromNb){
  var c=q.card,m=c.mode;
  SEEN[m][q.key]=(SEEN[m][q.key]||0)+1;lsw('wordarrow-seen-'+m,SEEN[m]);
  S.used[q.key]=1;
  if(!ok){nbAdd(c);S.miss[c.id]=(S.miss[c.id]||0)+1}
  else if(fromNb){nbDec(c)}
}

/* ---------- questions ---------- */
function variants(c){
  if(c.kind==='e') return CAN_SPEAK?['A','B','C','D','E','F','G']:['A','B','C','D','G'];
  if(c.kind==='k') return c.advanced?['M','Z']:['N','J','M','Z','W'];
  if(c.kind==='c') return ['w0','w1','t0','t1'];
  return c.s.map(function(_,i){return 'i'+i}).concat(['N','W']);
}
var SIMPLE=['横','縦','左払い','右払い','点'];
function classify(pts,w){
  var a=pts[0],b=pts[pts.length-1],dx=b.x-a.x,dy=b.y-a.y,pl=0,i;
  for(i=1;i<pts.length;i++){var ex=pts[i].x-pts[i-1].x,ey=pts[i].y-pts[i-1].y;pl+=Math.sqrt(ex*ex+ey*ey)}
  if(pl<w*.09) return '点';
  var ang=Math.atan2(dy,dx)*180/Math.PI;
  if(ang>-30&&ang<=28) return '横';
  if(ang>75&&ang<=105) return '縦';
  if(ang>28&&ang<=75) return '右払い';
  if(ang>105) return '左払い';
  return '?';
}
function initPad(cv){
  var ctx=cv.getContext('2d'),strokes=[],cur=null,locked=false,dpr=window.devicePixelRatio||1;
  function paint(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(6,cv.clientWidth/34);ctx.strokeStyle=getComputedStyle(cv).color;
    strokes.forEach(function(s){
      ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);
      if(s.length===1) ctx.lineTo(s[0].x+.01,s[0].y);
      for(var i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y);
      ctx.stroke();
    });
  }
  function pt(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);
  cv.addEventListener('pointerdown',function(e){if(locked)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}cur=[pt(e)];strokes.push(cur);paint()});
  cv.addEventListener('pointermove',function(e){if(!cur)return;cur.push(pt(e));paint()});
  function end(){cur=null}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  paint();
  return {strokes:function(){return strokes},clear:function(){strokes.length=0;paint()},undo:function(){strokes.pop();paint()},lock:function(){locked=true},width:function(){return cv.clientWidth}};
}

function allCards(kind){return Object.keys(BYID).map(function(id){return BYID[id]}).filter(function(x){return x.kind===kind})}
function edistract(c,field){
  var seen={};seen[c[field]]=1;var out=[];
  shuffle(allCards('e').filter(function(x){return x!==c&&x.pos===c.pos})).forEach(function(x){
    if(out.length<3&&!seen[x[field]]){seen[x[field]]=1;out.push(x)}
  });
  return out;
}
function misspell(w){
  var seen={},res=[],tries=0,V='aeiou';
  while(res.length<3&&tries<80){
    tries++;
    var a=w.split(''),t=Math.floor(Math.random()*4),i=1+Math.floor(Math.random()*Math.max(1,a.length-2)),r;
    if(t===0){if(i>=a.length-1)continue;var x=a[i];a[i]=a[i+1];a[i+1]=x}
    else if(t===1){a.splice(i,1)}
    else if(t===2){a.splice(i,0,a[i])}
    else{
      var js=[];a.forEach(function(ch,k){if(k>0&&V.indexOf(ch)>=0)js.push(k)});
      if(!js.length) continue;
      var j=js[Math.floor(Math.random()*js.length)];
      a[j]=V.charAt((V.indexOf(a[j])+1+Math.floor(Math.random()*4))%5);
    }
    r=a.join('');
    if(r!==w&&!seen[r]){seen[r]=1;res.push(r)}
  }
  while(res.length<3) res.push(w+'e'.repeat(res.length+1));
  return res;
}

function pickQ(cards,lastKey){
  var cand=[],tot=0,seen=SEEN[cards[0].mode],lastCard=lastKey?lastKey.split('|')[0]:null;
  cards.forEach(function(c){
    variants(c).forEach(function(v){
      var key=c.id+'|'+v; if(key===lastKey) return;
      var w=1/(1+(seen[key]||0)*1.5);
      if(S.used[key]) w*=.06;
      if(c.id===lastCard&&cards.length>1) w*=.12;
      if(v==='W') w*=1.5;
      w*=1+((NB[c.mode][c.id]||{n:0}).n)*.6+(S.miss[c.id]||0)*.8;
      cand.push({c:c,v:v,w:w});tot+=w;
    });
  });
  if(!cand.length){var c0=cards[0];return makeQ(c0,variants(c0)[0])}
  var p=Math.random()*tot;
  for(var i=0;i<cand.length;i++){p-=cand[i].w;if(p<=0)return makeQ(cand[i].c,cand[i].v)}
  return makeQ(cand[0].c,cand[0].v);
}
function numOpts(n){
  var pool=[];for(var d=-3;d<=3;d++){if(d!==0&&n+d>=1)pool.push(n+d)}
  var w=shuffle(pool).slice(0,3).concat([n]).sort(function(a,b){return a-b});
  return w.map(function(x){return {label:x+'画',ok:x===n}});
}

  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(t0,d,vol){
  if(!SND) return; var a=ac(); if(!a) return;
  var len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),data=buf.getChannelData(0);

  var s=a.createBufferSource(),g=a.createGain(),t=a.currentTime+t0;
  s.buffer=buf;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(g);g.connect(a.destination);s.start(t);
}

/* ---------- board logic ---------- */
function findMatches(){
  var s={},b=S.b,r,c,t;
  function at(r,c){return b[r]&&b[r][c]?b[r][c].t:-9}
  for(r=0;r<N;r++)for(c=0;c<N-2;c++){t=at(r,c);if(t>=0&&at(r,c+1)===t&&at(r,c+2)===t){s[r+','+c]=1;s[r+','+(c+1)]=1;s[r+','+(c+2)]=1}}
  for(c=0;c<N;c++)for(r=0;r<N-2;r++){t=at(r,c);if(t>=0&&at(r+1,c)===t&&at(r+2,c)===t){s[r+','+c]=1;s[(r+1)+','+c]=1;s[(r+2)+','+c]=1}}
  return Object.keys(s);
}
function hasMoves(){
  var b=S.b;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var d=[[0,1],[1,0]];
    for(var k=0;k<2;k++){
      var r2=r+d[k][0],c2=c+d[k][1]; if(r2>=N||c2>=N) continue;
      var A=b[r][c],B=b[r2][c2]; if(A.t<0||B.t<0) continue;
      b[r][c]=B;b[r2][c2]=A; var m=findMatches().length>0; b[r][c]=A;b[r2][c2]=B;
      if(m) return true;
    }
  }
  return false;
}
function fillQ(c){while(S.q[c].length<3)S.q[c].push(rnd())}
function newBoard(){
  var tries=0;
  do{
    S.b=[];
    for(var r=0;r<N;r++){S.b[r]=[];for(var c=0;c<N;c++){
      var t;do{t=rnd()}while((c>=2&&S.b[r][c-1].t===t&&S.b[r][c-2].t===t)||(r>=2&&S.b[r-1][c].t===t&&S.b[r-2][c].t===t));
      S.b[r][c]={t:t,f:0};}}
    tries++;
  }while(!hasMoves()&&tries<50);
  S.q=[];for(var q=0;q<N;q++){S.q[q]=[];fillQ(q)}
}
function reshuffle(){
  var tries=0,cells=[],r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(S.b[r][c].t>=0)cells.push(S.b[r][c]);
  do{
    var ts=shuffle(cells.map(function(x){return x.t})),i=0;
    cells.forEach(function(x){x.t=ts[i++]});
    tries++;
  }while((findMatches().length||!hasMoves())&&tries<60);
}
function jamaCount(){var n=0;for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(S.b[r][c]&&S.b[r][c].t<0)n++;return n}
function gravity(){
  for(var c=0;c<N;c++){
    var w=N-1,r;
    for(r=N-1;r>=0;r--){
      var cell=S.b[r][c];
      if(cell){ if(w!==r){S.b[w][c]=cell;S.b[r][c]=null;cell.f=w-r} w--; }
    }
    for(r=w;r>=0;r--){S.b[r][c]={t:S.q[c].shift(),f:w+1};fillQ(c)}
  }
}

  var cs=chargeStat(),pips='';
  for(var k=0;k<3;k++) pips+=k<S.charge.length?'●':'○';
  i.innerHTML='<span>チャージ '+pips+(S.charge.length?'　合計 '+Math.round(cs.P)+' ×'+cs.M.toFixed(1):'')+'</span><span>れんぞく正解 '+S.streak+'</span><span>じゃま '+jamaCount()+'</span>';
  $('#score').textContent=S.score+' pt';
}
function flash(msg){
  var t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('#fx').appendChild(t);setTimeout(function(){t.remove()},1300);
}

/* ---------- battle ---------- */
function startBattle(){
  var st=stages()[S.stage],mon=MONS[S.stage]; window.scrollTo(0,0);
  S.maxHp=300+S.stage*35;S.hp=S.maxHp;S.moves=0;S.streak=0;S.locked=true;S.sel=null;S.drag=null;S.lastKey=null;S.stat={};S.charge=[];
  st.cards.forEach(function(c){S.stat[c.id]={ok:0,ng:0,asked:0}});
  app.innerHTML=
  '<section class="battle" id="battle">'+
   '<div class="bar"><span class="stg">STAGE '+(S.stage+1)+'</span><span class="stn">'+MODE_NAME[S.mode]+'　'+st.name+'</span><button type="button" class="snd" id="snd"></button><span class="sc" id="score"></span></div>'+
   '<div class="arena"><div class="mon" id="mon" style="--ms:'+(100+S.stage*10)+'px">'+monsterSVG(mon)+'</div><div class="mname">'+mon.name+'</div>'+
   '<div class="hp" role="progressbar" aria-label="モンスターの体力"><i id="hpfill"></i><b id="hptxt"></b></div></div>'+
   '<div class="slot" id="slot"><div class="pv" id="pv" aria-hidden="true"></div><div class="board" id="board"></div></div>'+
   '<div class="foot" id="info"></div>'+
   '<div class="fx" id="fx"></div>'+
  '</section>';
  board=$('#board');slot=$('#slot');battle=$('#battle');bindSnd();
  setHp();
  newBoard();render();updateInfo();
  board.addEventListener('pointerdown',onDown);
  board.addEventListener('pointermove',onMove);
  S.locked=false;
}
function onDown(e){
  var el=e.target.closest('.cell'); if(!el||S.locked) return;
  var r=+el.dataset.r,c=+el.dataset.c;
  if(S.sel){
    if(S.sel.r===r&&S.sel.c===c){S.sel=null;S.drag=null;renderSel();return}
    if(Math.abs(S.sel.r-r)+Math.abs(S.sel.c-c)===1){var a=S.sel;S.sel=null;S.drag=null;swapTry(a.r,a.c,r,c);return}
  }
  S.sel={r:r,c:c};S.drag={x:e.clientX,y:e.clientY,r:r,c:c};renderSel();
}
function onMove(e){
  if(!S.drag||S.locked) return;
  var dx=e.clientX-S.drag.x,dy=e.clientY-S.drag.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
  var r=S.drag.r,c=S.drag.c,r2=r,c2=c;
  if(Math.abs(dx)>Math.abs(dy)) c2+=dx>0?1:-1; else r2+=dy>0?1:-1;
  S.drag=null;S.sel=null;
  if(r2>=0&&r2<N&&c2>=0&&c2<N) swapTry(r,c,r2,c2); else renderSel();
}
window.addEventListener('pointerup',function(){S.drag=null});

function setHp(){
  var f=$('#hpfill'),t=$('#hptxt'); if(!f) return;
  f.style.width=(100*S.hp/S.maxHp)+'%';
  t.textContent='HP '+S.hp+' / '+S.maxHp;
  var mon=$('#mon');
  if(mon&&S.hp>0&&S.hp<=S.maxHp/2&&!mon.classList.contains('rage')){
    mon.classList.add('rage');
    if($('#fx')){flash('怒りモード！');SFX.rage()}
  }
}
/* 3 puzzle rounds are added up (P) and their combo bonuses are multiplied (M, capped) */
function chargeStat(){
  var P=0,M=1,tn=0;
  S.charge.forEach(function(m){
    P+=m.n*4*(m.ok?1:.25);
    M*=1+.2*(m.chain-1)+.04*Math.max(0,m.n-3);
    tn+=m.n;
  });
  return {P:P,M:Math.min(3,M),tn:tn};
}

async function swapTry(r1,c1,r2,c2){
  if(S.locked) return;
  var A=S.b[r1][c1],B=S.b[r2][c2];
  if(A.t<0||B.t<0){flash('じゃまブロックは動かせません');S.sel=null;renderSel();return}
  S.locked=true;S.sel=null;
  S.b[r1][c1]=B;S.b[r2][c2]=A;render();
  if(!findMatches().length){
    await sleep(200);S.b[r1][c1]=A;S.b[r2][c2]=B;render();S.locked=false;flash('そろいません');return;
  }
  S.moves++;
  var res=await resolve();
  var ok=await askQuiz(res.cleared,res.chain);
  if(ok) S.streak++; else S.streak=0;
  S.charge.push({n:res.cleared,chain:res.chain,ok:ok});
  if(S.charge.length<3){
    SFX.charge(S.charge.length);
    var cs=chargeStat();
    flash('チャージ '+S.charge.length+' / 3　合計 '+Math.round(cs.P)+'　×'+cs.M.toFixed(1));
    updateInfo();
  }else{
    await fire();
    S.charge=[];
  }
  if(S.hp<=0){await victory();return}
  if(!ok){await addJama(2)}
  if(!hasMoves()){reshuffle();render();flash('シャッフル')}
  updateInfo();
  S.locked=false;
}
async function resolve(){
  var cleared=0,chain=0;
  while(true){
    var m=findMatches(); if(!m.length) break;
    chain++; cleared+=m.length;
    var all={};m.forEach(function(k){all[k]=1});
    m.forEach(function(k){
      var p=k.split(','),r=+p[0],c=+p[1];
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var rr=r+d[0],cc=c+d[1];
        if(rr>=0&&rr<N&&cc>=0&&cc<N&&S.b[rr][cc]&&S.b[rr][cc].t<0) all[rr+','+cc]=1;
      });
    });
    if(chain>1) flash(chain+'連鎖！');
    SFX.match(chain);render(all);await sleep(280);
    Object.keys(all).forEach(function(k){var p=k.split(',');S.b[+p[0]][+p[1]]=null});
    gravity();render();await sleep(330);
  }
  return {cleared:cleared,chain:chain};
}
async function addJama(n){
  var free=[],r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(S.b[r][c].t>=0)free.push([r,c]);
  var room=Math.max(0,10-jamaCount()); n=Math.min(n,room,free.length-6);
  if(n<=0) return;
  shuffle(free).slice(0,n).forEach(function(p){S.b[p[0]][p[1]]={t:-1,f:0}});
  render();flash('じゃまブロックが出た！');await sleep(500);
  if(findMatches().length){await resolve()}
}

/* ---------- asking ---------- */
function battleQ(){
  var cur=stages()[S.stage].cards;
  if(S.stage>0&&Math.random()<.2){
    var old=[];for(var i=0;i<S.stage;i++)stages()[i].cards.forEach(function(c){old.push(c)});
    var q=pickQ(old,S.lastKey);q.old=true;return q;
  }
  return pickQ(cur,S.lastKey);
}
async function askQuiz(n,chain){
  var q=battleQ();
  slot.style.minHeight=slot.offsetHeight+'px';
  board.hidden=true;$('#pv').hidden=true;
  var host=document.createElement('div');slot.appendChild(host);
  var head='チャージ '+(S.charge.length+1)+'/3　ブロック×'+n+(chain>1?'　'+chain+'連鎖':'');
  var ok=await quizUI(q,host,{head:head,next:S.charge.length>=2?'3発合体！発射':'チャージ！',old:q.old});
  host.remove();board.hidden=false;$('#pv').hidden=false;slot.style.minHeight='';
  var s=S.stat[q.card.id];
  if(s){s.asked++;if(ok)s.ok++;else s.ng++}
  S.lastKey=q.key;
  record(q,ok,false);
  if(ok){S.tot.ok++;S.score+=30}else{S.tot.ng++}
  return ok;
}
async function runTest(cards,o){
  var rt={},lastKey=null;
  for(var i=0;i<cards.length;i++){
    window.scrollTo(0,0);
    app.innerHTML='<section style="max-width:720px;margin:0 auto"><div class="head"><p class="eyebrow">'+(o.nb?'まちがいノート':'復習テスト')+' '+(i+1)+' / '+cards.length+'</p></div><div id="rtq"></div></section>';
    var q=pickQ([cards[i]],lastKey);lastKey=q.key;
    var ok=await quizUI(q,$('#rtq'),{head:'',next:i<cards.length-1?'つぎへ':'おわり'});
    record(q,ok,!!o.nb);
    rt[cards[i].id]=ok;
  }
  return rt;
}

/* ---------- firing ---------- */
var ARROW='<svg viewBox="0 0 16 48" width="16" height="48" aria-hidden="true"><path class="flame" d="M5 34 L8 47 L11 34 Z"/><path class="fin" d="M3 26 L0 40 L3 36 Z M13 26 L16 40 L13 36 Z"/><rect class="body" x="3" y="14" width="10" height="21" rx="1"/><path class="nose" d="M8 0 Q13 7 13 15 H3 Q3 7 8 0 Z"/></svg>';
async function fire(){
  var cs=chargeStat(),P=cs.P,M=cs.M,tn=cs.tn;
  var allBad=S.charge.every(function(m){return !m.ok});
  var sb=1+Math.min(S.streak,5)*.05;
  var dmg=Math.max(1,Math.round(P*M*sb));
  var sc=Math.min(3.4,1+(M-1)*1.1+Math.max(0,tn-9)*.03);
  flash('3発合体！ ×'+M.toFixed(1));
  SFX.shot(allBad?1:sc);
  var fx=$('#fx'),mon=$('#mon'),br=battle.getBoundingClientRect(),mr=mon.getBoundingClientRect(),sr=board.getBoundingClientRect();
  var cnt=Math.min(9,Math.max(3,Math.ceil(tn/2))),anims=[];
  if(sc>2.2) cnt=Math.max(3,Math.ceil(cnt*.6));
  for(var i=0;i<cnt;i++){
    var a=document.createElement('div');a.className='arrow'+(sc>1.8?' big':'');a.innerHTML=ARROW;fx.appendChild(a);
    var sx=(sr.left-br.left)+sr.width*(.12+.76*i/Math.max(cnt-1,1)),sy=(sr.top-br.top)+24;
    a.style.left=sx+'px';a.style.top=sy+'px';
    var tx=(mr.left-br.left+mr.width/2+(Math.random()-.5)*50)-sx,ty=(mr.top-br.top+mr.height/2)-sy;
    var ang=Math.atan2(tx,-ty)*180/Math.PI,k=allBad?.45:1,s2=allBad?1:sc;
    var frames=[{transform:'translate(0,0) rotate('+ang+'deg) scale('+s2+')',opacity:1},
      {transform:'translate('+tx*k+'px,'+ty*k+'px) rotate('+ang+'deg) scale('+s2+')',opacity:allBad?0:1}];
    var an=a.animate(frames,{duration:480+(sc>1.8?120:0),delay:i*55,easing:'ease-in',fill:'forwards'});
    anims.push(an.finished.catch(function(){}));
  }
  await Promise.all(anims);
  fx.querySelectorAll('.arrow').forEach(function(x){x.remove()});
  var f=document.createElement('div');f.className='float';
  f.style.left=(mr.left-br.left+mr.width/2)+'px';f.style.top=(mr.top-br.top+mr.height/3)+'px';
  if(!allBad){f.textContent='-'+dmg;f.style.fontSize=(30+(sc-1)*10)+'px';mon.classList.add('hit')}
  else{f.textContent='弱い -'+dmg;mon.classList.add('laugh')}
  var dealt=Math.min(S.hp,dmg);
  S.hp=Math.max(0,S.hp-dmg);S.score+=dealt;setHp();
  fx.appendChild(f);updateInfo();
  await sleep(650);
  mon.classList.remove('hit','laugh');f.remove();
}
async function victory(){
  var fx=$('#fx'),mon=$('#mon'),br=battle.getBoundingClientRect(),mr=mon.getBoundingClientRect();
  var cx=mr.left-br.left+mr.width/2,cy=mr.top-br.top+mr.height/2,i;
  progSet(S.mode,S.stage+1);
  SFX.defeat();
  mon.classList.add('boom');
  await sleep(520);
  var fl=document.createElement('div');fl.className='flash';fx.appendChild(fl);
  fl.animate([{opacity:.85},{opacity:0}],{duration:450,fill:'forwards'});
  for(i=0;i<2;i++){
    var w=document.createElement('div');w.className='ring-wave';
    var sz=Math.max(40,mr.width*.5);
    w.style.cssText='left:'+(cx-sz/2)+'px;top:'+(cy-sz/2)+'px;width:'+sz+'px;height:'+sz+'px';
    fx.appendChild(w);
    w.animate([{transform:'scale(.3)',opacity:1},{transform:'scale('+(3.2+i)+')',opacity:0}],{duration:800,delay:i*140,easing:'ease-out',fill:'forwards'});
  }
  for(i=0;i<36;i++){
    var p=document.createElement('div');p.className='part';p.style.left=cx+'px';p.style.top=cy+'px';
    p.innerHTML=gem(rnd());fx.appendChild(p);
    var ang=Math.random()*Math.PI*2,dist=mr.width*(.5+Math.random()*1.1)+40;
    p.animate([{transform:'translate(0,0) rotate(0deg) scale(1.5)',opacity:1},
      {transform:'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist+60)+'px) rotate('+Math.round(Math.random()*720-360)+'deg) scale(.2)',opacity:0}],
      {duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
  }
  var t=document.createElement('div');t.className='boomtxt';t.textContent='撃破！';t.style.top=cy+'px';fx.appendChild(t);
  t.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(-8deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.25) rotate(-4deg)',opacity:1,offset:.35},{transform:'translate(-50%,-50%) scale(1) rotate(-4deg)',opacity:1}],{duration:700,easing:'ease-out',fill:'forwards'});
  await sleep(1900);
  showReview(false,{});
}

/* ---------- review ---------- */
function showReview(retested,rt){
  var st=stages()[S.stage]; window.scrollTo(0,0);
  var missed=st.cards.filter(function(c){return S.stat[c.id]&&S.stat[c.id].ng>0});
  var rows=st.cards.slice().sort(function(a,b){return (S.stat[b.id]?S.stat[b.id].ng:0)-(S.stat[a.id]?S.stat[a.id].ng:0)}).map(function(c){
    var s=S.stat[c.id]||{ng:0},bad=s.ng>0,badge;
    if(retested&&rt[c.id]!==undefined) badge=rt[c.id]?'<span class="badge">復習OK</span>':'<span class="badge ng">もう一度見直そう</span>';
    else badge=bad?'<span class="badge ng">まちがい '+s.ng+'回</span>':'<span class="badge">ばっちり</span>';
    return cardHTML(c,{badge:badge,miss:bad});
  }).join('');
  var last=S.stage>=9;
  var btns='';
  if(missed.length&&!retested) btns+='<button type="button" class="btn primary" id="rt">まちがえた'+missed.length+'枚をテスト</button><button type="button" class="btn ghost" id="nx">そのまま進む</button>';
  else btns+='<button type="button" class="btn primary" id="nx">'+(last?'けっかを見る':'STAGE '+(S.stage+2)+'へ')+'</button>';
  if(!last) btns+='<button type="button" class="btn ghost" id="quit">ここでやめて記録する</button>';
  app.innerHTML=
  '<section><div class="head"><p class="eyebrow">STAGE '+(S.stage+1)+' クリア</p><h2>'+MONS[S.stage].name+'を倒した！</h2>'+
  '<p class="lead">'+(missed.length?'まちがえたカードを上にならべました。まちがいノートにも残っています。':'4枚すべて、まよわず正解できました。')+'</p></div>'+
  '<div class="rv">'+rows+'</div><div class="actions" style="max-width:520px">'+btns+'</div></section>';
  bindSay(app);
  $('#nx').onclick=function(){
    S.stage++;
    if(S.stage>=10){progSet(S.mode,0);showFinal(10)}else showStudy(S.stage);
  };
  var q=$('#quit');if(q) q.onclick=function(){showFinal(S.stage+1)};
  var rb=$('#rt');if(rb) rb.onclick=async function(){var r=await runTest(missed,{});showReview(true,r)};
}

function showFinal(cleared){
  window.scrollTo(0,0);
  var m=S.mode,tot=S.tot.ok+S.tot.ng,acc=tot?Math.round(100*S.tot.ok/tot):0,done=cleared>=10;
  var ms=Object.keys(S.miss).filter(function(id){return BYID[id]}).sort(function(a,b){return S.miss[b]-S.miss[a]}).slice(0,6);
  var rk=RK[m],best=rk.length?rk[0].score:0;
  var qual=S.score>0&&(rk.length<5||S.score>rk[rk.length-1].score),isBest=S.score>best&&S.score>0;
  var lastName=lsj('wordarrow-name','');
  var saved=false;
  if(done) SFX.fan();
  app.innerHTML=
  '<section><div class="head"><p class="eyebrow">'+MODE_NAME[m]+'　STAGE '+cleared+' まで到達</p><h2>'+(done?MONS[9].name+'を倒した！':'ここまでの記録')+'</h2></div>'+
  '<div class="sum"><div class="bignum">'+S.score+'<small style="font-size:.4em"> pt</small></div><p class="lead">'+S.tot.ok+'問正解 / '+tot+'問（正答率 '+acc+'%）</p></div>'+
  (qual?'<div class="namebox" id="nbox"><div class="verdict ok">'+(isBest?'最高記録を更新！':'ランクイン！')+'</div><label for="nm">名前を残そう</label><input id="nm" maxlength="10" autocomplete="off" value="'+esc(lastName)+'" placeholder="10文字まで"><button type="button" class="btn primary" id="save">記録する</button></div>':'')+
  '<div id="rkbox"><p class="sec">'+MODE_NAME[m]+'のランキング</p>'+rkHTML(m,-1)+'</div>'+
  (ms.length?'<p class="sec">まちがいが多かった問題</p><div class="rv">'+ms.map(function(id){return cardHTML(BYID[id],{badge:'<span class="badge ng">'+S.miss[id]+'回</span>',miss:1})}).join('')+'</div>':'<p class="lead" style="margin-bottom:16px">1問もまちがえませんでした。</p>')+
  '<div class="actions two" style="max-width:520px"><button type="button" class="btn ghost" id="nbb">まちがいノート</button><button type="button" class="btn primary" id="again">タイトルへ</button></div></section>';
  bindSay(app);
  if(window.WAOnline && window.WAOnline.submitNormalScore){
    window.WAOnline.submitNormalScore({subject:m==='e'?'eiken4':'kanken4',score:S.score,stages:cleared,correct:S.tot.ok,total:tot}).catch(function(e){console.warn('Online score sync failed:',e)});
  }
  var sv=$('#save');
  if(sv) sv.onclick=function(){
    if(saved) return; saved=true;
    var nm=($('#nm').value||'').trim().slice(0,10)||'ななし';
    lsw('wordarrow-name',nm);
    var d=new Date(),entry={name:nm,score:S.score,stages:cleared,date:d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};
    RK[m].push(entry);
    RK[m].sort(function(a,b){return b.score-a.score});
    RK[m]=RK[m].slice(0,5);lsw('wordarrow-rank-'+m,RK[m]);
    var hi=RK[m].indexOf(entry);
    $('#nbox').innerHTML='<div class="verdict ok">記録しました！</div>';
    $('#rkbox').innerHTML='<p class="sec">'+MODE_NAME[m]+'のランキング</p>'+rkHTML(m,hi);
    SFX.good();
  };
  $('#nbb').onclick=function(){showNotebook(m)};
  $('#again').onclick=showTitle;
}

showTitle();
})();
</script>

<script>
/* Character recall practice: supplied 4-10 grade glyph list; self-assessed, not a reading quiz. */

cover.style.cssText='position:fixed;inset:0;z-index:90000;background:var(--bg,#fff);color:var(--ink,#222);overflow:auto;padding:24px max(16px,calc((100vw - 620px)/2));font-family:system-ui,sans-serif';
document.body.appendChild(cover);
function html(x){cover.innerHTML=x}
function stop(){if(timer)clearTimeout(timer);timer=null}
function close(){stop();cover.hidden=true}
function setup(){stop();cover.hidden=false;var mastered=Object.values(state).filter(Boolean).length;
 html('<h2>漢検4級・全対象漢字</h2><p>掲載一覧の1,339字（4〜10級区分）。出典ページの公称1,322字との差17字は未解決です。</p><p>覚えた文字：'+mastered+' / '+chars.length+'</p><p>文字を3秒間見て覚え、隠れたら紙に書いてください。自己採点方式です。</p><label>出題範囲 <select id="wa-level"><option value="4">4級配当のみ（313字）</option><option value="all">4〜10級すべて（1,339字）</option></select></label><p><button id="wa-begin">10文字を練習</button> <button id="wa-close">戻る</button></p>');
 document.getElementById('wa-begin').onclick=function(){var v=document.getElementById('wa-level').value;queue=shuffle(chars.filter(function(x){return v==='all'||x[1]===4}).slice());queue.sort(function(a,b){return Number(!!state[a[0]])-Number(!!state[b[0]])});queue=queue.slice(0,10);pos=0;next()};
 document.getElementById('wa-close').onclick=close;
}
function next(){stop();if(pos>=queue.length){html('<h2>10文字の練習終了</h2><p>次の10文字も練習できます。</p><button id="wa-more">もう一度</button> <button id="wa-close">戻る</button>');document.getElementById('wa-more').onclick=setup;document.getElementById('wa-close').onclick=close;return}
 var d=queue[pos];shown=false;
 html('<p>第 '+(pos+1)+' / '+queue.length+' 字　（'+d[1]+'級区分）</p><h2>この漢字を覚えよう</h2><div style="font-size:120px;text-align:center;font-weight:bold" id="wa-glyph"></div><p id="wa-instruction">3秒後に文字が隠れます</p><button id="wa-show" disabled>答えを見る</button> <button id="wa-exit">終了</button>');
 document.getElementById('wa-glyph').textContent=d[0];document.getElementById('wa-exit').onclick=setup;
 timer=setTimeout(function(){document.getElementById('wa-glyph').textContent='？';document.getElementById('wa-instruction').textContent='紙に漢字を書いてから「答えを見る」を押そう';document.getElementById('wa-show').disabled=false},3000);
 document.getElementById('wa-show').onclick=function(){if(shown)return;shown=true;document.getElementById('wa-glyph').textContent=d[0];document.getElementById('wa-instruction').textContent='書いた漢字と見比べて自己採点';this.outerHTML='<button id="wa-yes">書けた</button> <button id="wa-no">まだ覚えていない</button>';
 function mark(ok){state[d[0]]=ok;localStorage.setItem(key,JSON.stringify(state));pos++;next()}
 document.getElementById('wa-yes').onclick=function(){mark(true)};document.getElementById('wa-no').onclick=function(){mark(false)};
 };
}
document.addEventListener('click',function(e){if(e.target && e.target.id==='kanji-all')setup()});
})();
</script>
