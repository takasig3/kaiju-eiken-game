/* Animated GIF: use the actual 512x512 image, not a spritesheet */
.mon.electric-mon{width:min(calc(var(--ms,120px)*1.65),100%);aspect-ratio:1/1;max-height:38vh;overflow:visible;border-radius:15px}
.mon.electric-mon .electric-sprite{display:block;width:100%;height:100%;object-fit:contain;border-radius:15px}
.mon.electric-mon.rage .electric-sprite{filter:saturate(1.3) brightness(1.12)}
.mon.electric-mon.hit{animation:shake .4s}
.mon.electric-mon.laugh{animation:bob .5s}
.mon.electric-mon.boom{animation:boom 1.1s forwards}
@media(prefers-reduced-motion:reduce){.mon.electric-mon.hit,.mon.electric-mon.laugh,.mon.electric-mon.boom{animation:none}}

/* All-stage illustrated monsters: full image contained, responsive, animated */
.mon.illustrated-mon{position:relative;width:min(calc(var(--ms,120px)*1.95),100%,36vh);aspect-ratio:1/1;overflow:visible;display:grid;place-items:center;transform-origin:50% 85%;animation:monster-breathe 2.3s ease-in-out infinite}
.mon.illustrated-mon .monster-portrait{width:100%;height:100%;object-fit:contain;display:block;border-radius:12px;filter:drop-shadow(0 5px 4px rgba(0,0,0,.15))}
.mon.illustrated-mon .monster-sweat,.mon.illustrated-mon .monster-pain{display:none;position:absolute;pointer-events:none}
.mon.illustrated-mon.exhausted{animation:monster-exhausted 1.3s ease-in-out infinite;transform-origin:50% 90%}
.mon.illustrated-mon.exhausted .monster-portrait{filter:saturate(.62) brightness(.84) drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.mon.illustrated-mon.exhausted .monster-sweat{display:block;right:4%;top:10%;font-size:clamp(20px,3vw,36px);animation:sweat-wobble 1.2s infinite}
.mon.illustrated-mon.exhausted .monster-pain{display:block;left:0;bottom:5%;background:#fff;border:2px solid #5c6671;color:#293746;border-radius:20px;padding:0 8px;font-size:clamp(11px,1.4vw,16px);font-weight:900;transform:rotate(-9deg)}
.mon.illustrated-mon.hit{animation:shake .4s}
.mon.illustrated-mon.laugh{animation:bob .5s}
.mon.illustrated-mon.boom{animation:boom 1.1s forwards}
@keyframes monster-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.025)}}
@keyframes monster-exhausted{0%,100%{transform:translateY(8px) rotate(-5deg) scale(.94)}50%{transform:translateY(12px) rotate(-7deg) scale(.92)}}
@keyframes sweat-wobble{50%{transform:translateY(8px) rotate(10deg)}}
@media(prefers-reduced-motion:reduce){.mon.illustrated-mon,.mon.illustrated-mon.exhausted{animation:none}}

/* Frame-animated characters, including a separate exhausted expression */
.mon.illustrated-mon .monster-portrait{mix-blend-mode:normal;object-fit:contain;border-radius:10px}
.mon.illustrated-mon.exhausted .monster-portrait{filter:none}

/* Final boss battle and optional finishing shot */
.battle.final-boss .arena{position:relative;isolation:isolate;border-radius:22px;background:radial-gradient(ellipse at 50% 42%,rgba(125,64,177,.25),rgba(34,23,61,.10) 52%,transparent 76%);padding:14px 10px 12px}

.battle.final-boss .illustrated-mon{width:min(calc(var(--ms,120px)*2.2),100%,42vh);filter:drop-shadow(0 0 17px rgba(124,52,199,.55))}

.boss-banner{font-family:var(--f-display);letter-spacing:.16em;font-size:clamp(13px,2vw,21px);font-weight:900;color:#8d29b0;text-align:center;text-shadow:0 1px 0 #fff}

.finish-btn:disabled{opacity:.5;cursor:wait}
@keyframes boss-aura{from{transform:scale(.95) rotate(-4deg);opacity:.65}to{transform:scale(1.05) rotate(4deg);opacity:1}}

.piercing-arrow svg{filter:drop-shadow(0 0 8px #54d7ff) drop-shadow(0 0 4px #54d7ff)}

.padbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,340px);margin:0 auto}

/* 8 unique study cards per stage; rotate the least-used cards between new runs. */
function makePlan(m){
  var pool=Object.keys(BYID).map(function(id){return BYID[id]}).filter(function(c){return c.mode===m&&variants(c).length});
  var history=lsj('wordarrow-plan-count-v2-'+m,{});
  var shuffled=shuffle(pool.slice());
  shuffled.sort(function(a,b){return (history[a.id]||0)-(history[b.id]||0)});
  var chosen=shuffled.slice(0,Math.min(80,shuffled.length));
  chosen.forEach(function(c){history[c.id]=(history[c.id]||0)+1});
  lsw('wordarrow-plan-count-v2-'+m,history);
  // Preserve a mix of question types when possible, without repeating a card in the same run.
  chosen=shuffle(chosen);
  var plan=[];
  for(var i=0;i<10;i++){
    var stage=[];
    for(var j=0;j<8;j++){
      var index=i*8+j;
      if(chosen.length)stage.push(chosen[index%chosen.length].id);
    }
    plan.push(stage);
  }
  return plan;
}

function preferredSpeechVoice(lang){
  refreshSpeechVoices();
  var target=(lang||'en-US').toLowerCase();
  var primary=target.split('-')[0];
  var candidates=speechVoices.filter(function(v){return v.lang&&v.lang.toLowerCase().split('-')[0]===primary});
  if(!candidates.length)return null;
  function rank(v){
    var code=v.lang.toLowerCase(),name=v.name||'',score=0;
    if(code===target)score+=100;
    else if(code.split('-')[0]===primary)score+=25;
    if(/premium|enhanced|neural|natural/i.test(name))score+=45;
    if(/samantha|ava|allison|susan|alex|daniel|serena|google us english|microsoft aria|microsoft jenny/i.test(name))score+=15;
    if(/compact|eloquence|novelty|robot|whisper|bad news|good news|bubbles/i.test(name))score-=80;
    return score;
  }
  candidates.sort(function(a,b){return rank(b)-rank(a)});
  return candidates[0];
}

function pickQ(cards,lastKey){

    });
  });
  if(!cand.length)return null;
  // First choose an unseen card, then an unused question variant.
  var fresh=cand.filter(function(x){return !x.cardUsed&&x.key!==lastKey});
  if(!fresh.length)fresh=cand.filter(function(x){return !x.used&&x.key!==lastKey});
  if(!fresh.length)fresh=cand.filter(function(x){return x.key!==lastKey});
  if(!fresh.length)fresh=cand;
  var minimum=Math.min.apply(null,fresh.map(function(x){return x.seen}));
  var least=fresh.filter(function(x){return x.seen===minimum&&x.c.id!==lastCard});
  if(!least.length)least=fresh.filter(function(x){return x.seen===minimum});

var AC=null,SND=true;

function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
window.addEventListener('pointerdown',function(){ac()});
function tone(f,t0,d,type,vol,f2){
  if(!SND) return; var a=ac(); if(!a) return;
  var t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(t0,d,vol){
  if(!SND) return; var a=ac(); if(!a) return;
  var len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),data=buf.getChannelData(0);
  for(var i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
  var s=a.createBufferSource(),g=a.createGain(),t=a.currentTime+t0;
  s.buffer=buf;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(g);g.connect(a.destination);s.start(t);
}

  match:function(chain){
    var b=523.25*Math.pow(2,Math.min(chain-1,5)*2/12);
    [0,4,7,12].forEach(function(s,i){tone(b*Math.pow(2,s/12),i*.06,.2,'triangle',.13)});
  },
  good:function(){tone(784,0,.12,'square',.06);tone(1175,.1,.28,'square',.06)},
  bad:function(){tone(240,0,.28,'sawtooth',.07,130)},
  shot:function(big){tone(1000,0,.3,'sawtooth',.05,220);noise(0,.18,.05);if(big>1.8){tone(140,.25,.5,'sawtooth',.1,45);noise(.25,.4,.12)}},
  defeat:function(){

    [523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,.55+i*.11,.3,'square',.08)});
    tone(1046.5,1.0,.7,'triangle',.12);
  },
  rage:function(){tone(110,0,.6,'sawtooth',.1,55);tone(165,.05,.5,'square',.05,70);noise(0,.35,.08)},
  charge:function(k){tone(330*Math.pow(1.26,k),0,.14,'triangle',.1);tone(660*Math.pow(1.26,k),.08,.18,'triangle',.08)},
  fan:function(){[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){tone(f,i*.09,.3,'triangle',.1)})}

/* ---------- board logic ---------- */
function findMatches(){
  var s={},b=S.b,r,c,t;
  function at(r,c){return b[r]&&b[r][c]?b[r][c].t:-9}
  for(r=0;r<N;r++)for(c=0;c<N-2;c++){t=at(r,c);if(t>=0&&at(r,c+1)===t&&at(r,c+2)===t){s[r+','+c]=1;s[r+','+(c+1)]=1;s[r+','+(c+2)]=1}}
  for(c=0;c<N;c++)for(r=0;r<N-2;r++){t=at(r,c);if(t>=0&&at(r+1,c)===t&&at(r+2,c)===t){s[r+','+c]=1;s[(r+1)+','+c]=1;s[(r+2)+','+c]=1}}
  return Object.keys(s);
}
/* Special arrows: 4-in-a-row => piercing; 5+ => rainbow.
   Count uninterrupted runs before clearing, including cascades.
   A run of five awards only rainbow, not both rewards. */
function specialMatches(){
  var four=0,five=0,b=S.b;
  function at(r,c){return b[r]&&b[r][c]?b[r][c].t:-9}
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var t=at(r,c);if(t<0)continue;
    if(c===0||at(r,c-1)!==t){

      var A=b[r][c],B=b[r2][c2]; if(A.t<0||B.t<0) continue;

// which completes a real 3-match. If no legal candidate exists, refill normally.
function assistRefill(holes){
 if(!holes.length||Math.random()>=.55)return false;
 var choices=[],b=S.b;
 function at(r,c){return r>=0&&r<N&&c>=0&&c<N&&b[r][c]?b[r][c].t:-9}
 holes.forEach(function(p){var r=p[0],c=p[1],cell=b[r][c];
  for(var t=0;t<4;t++){
   var horiz=(at(r,c-2)===t&&at(r,c-1)===t)||(at(r,c-1)===t&&at(r,c+1)===t)||(at(r,c+1)===t&&at(r,c+2)===t);
   var vert=(at(r-2,c)===t&&at(r-1,c)===t)||(at(r-1,c)===t&&at(r+1,c)===t)||(at(r+1,c)===t&&at(r+2,c)===t);
   if((horiz||vert)&&cell.t!==t)choices.push({r:r,c:c,t:t});
  }
 });
 if(!choices.length)return false;
 var pick=choices[Math.floor(Math.random()*choices.length)];b[pick.r][pick.c].t=pick.t;

}
function gravity(){
  var holes=[];

    }
    for(r=w;r>=0;r--){S.b[r][c]={t:S.q[c].shift(),f:w+1};holes.push([r,c]);fillQ(c)}

var waSpellSeen={e:{},e5:{}};
function waSpellCandidate(){
  var mode=S.mode;
  if(mode!=='e'&&mode!=='e5')return null;
  var min=mode==='e5'?3:5,max=mode==='e5'?6:9;
  var pool=allCards('e').filter(function(c){return c.mode===mode&&/^[a-z]+$/i.test(c.en||'')&&c.en.length>=min&&c.en.length<=max&&c.ja});
  if(!pool.length)return null;
  var seen=waSpellSeen[mode]||(waSpellSeen[mode]={});
  var fresh=pool.filter(function(c){return !seen[c.en.toLowerCase()]});
  if(!fresh.length){waSpellSeen[mode]=seen={};fresh=pool}
  var card=fresh[Math.floor(Math.random()*fresh.length)];seen[card.en.toLowerCase()]=true;
  return card;
}

function waSpellShuffle(word){
  var original=word.toLowerCase().split(''),letters=original.slice();
  for(var attempt=0;attempt<15;attempt++){
    letters=shuffle(original);
    if(letters.join('')!==word.toLowerCase())break;
  }
  if(letters.join('')===word.toLowerCase()&&letters.length>1){var t=letters[0];letters[0]=letters[1];letters[1]=t}
  return letters;
}

async function finishPuzzleTurn(res){
  // A cascade earns visible points once per completed move, not per animation frame.
  if(res.chain>=2){var chainPts=(res.chain-1)*50;S.score+=chainPts;updateInfo();waShowPoints(chainPts,res.chain+'連鎖ボーナス','combo');}

  // Only an actual five-or-more cascade in this move summons the ally.
  // The ally quiz uses cards outside the current stage, and allows exactly one answer.
  if(res.chain>=5)await summonChainAlly();
  if(res.chain>=3&&(S.mode==='e'||S.mode==='e5')&&Math.random()<0.65)await waSpellingChallenge();
  var learningBonus=await learningTileChallenge();
  S.pendingSpecial=(res.five?'🌈レインボー×'+res.five+' ':'')+(res.four?'➶貫通×'+res.four:'');
  var ok=await askQuiz(res.cleared,res.chain);S.pendingSpecial='';
  if(ok) S.streak++; else S.streak=0;
  S.charge.push({n:res.cleared,chain:res.chain,ok:ok,bonus:learningBonus,special4:res.four,special5:res.five});
  if(S.charge.length<3){
    SFX.charge(S.charge.length);
    var cs=chargeStat();
    flash('チャージ '+S.charge.length+' / 3　合計 '+Math.round(cs.P)+'　×'+cs.M.toFixed(1));
    updateInfo();
  }else{
    await fire();
    S.charge=[];
  }
  if(S.hp<=0){await victory();return}
  if(!ok){await addJama(2)}
  if(!hasMoves()){reshuffle();render();flash('シャッフル')}
  updateInfo();
  S.locked=false;updateInfo();
}
async function resolve(){
  var cleared=0,chain=0,four=0,five=0;
  while(true){
    var m=findMatches(); if(!m.length) break;
    var special=specialMatches();four+=special.four;five+=special.five;
    if(special.five)flash('🌈 レインボーアロー ×'+special.five+' 獲得！');
    else if(special.four)flash('➶ 貫通アロー ×'+special.four+' 獲得！');
    chain++; cleared+=m.length;
    var all={};m.forEach(function(k){all[k]=1});
    m.forEach(function(k){
      var p=k.split(','),r=+p[0],c=+p[1];
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var rr=r+d[0],cc=c+d[1];
        if(rr>=0&&rr<N&&cc>=0&&cc<N&&S.b[rr][cc]&&S.b[rr][cc].t<0) all[rr+','+cc]=1;
      });
    });
    if(chain>1) flash(chain+'連鎖！');
    SFX.match(chain);render(all);await sleep(280);
    Object.keys(all).forEach(function(k){var p=k.split(',');S.b[+p[0]][+p[1]]=null});
    gravity();render();await sleep(330);
  }
  if(chain>=3){
    var candidates=[];
    for(var ir=0;ir<N;ir++)for(var ic=0;ic<N;ic++)if(S.b[ir][ic].t>=0&&!S.b[ir][ic].item)candidates.push([ir,ic]);
    if(candidates.length){
      var pos=candidates[Math.floor(Math.random()*candidates.length)];
      S.b[pos[0]][pos[1]].item=['row','col','burst','color'][Math.floor(Math.random()*4)];
      flash('🎁 3連鎖ボーナス！ アイテム出現');render();
    }
  }
  return {cleared:cleared,chain:chain,four:four,five:five};
}

 });

async function addJama(n){
  var free=[],r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(S.b[r][c].t>=0)free.push([r,c]);
  var room=Math.max(0,10-jamaCount()); n=Math.min(n,room,free.length-6);
  if(n<=0) return;
  shuffle(free).slice(0,n).forEach(function(p){S.b[p[0]][p[1]]={t:-1,f:0}});
  render();flash('じゃまブロックが出た！');await sleep(500);
  if(findMatches().length){await resolve()}
}

/* ---------- asking ---------- */
function battleQ(){
  var cur=stages()[S.stage].cards;
  if(S.stage>0&&Math.random()<.2){
    var old=[];for(var i=0;i<S.stage;i++)stages()[i].cards.forEach(function(c){old.push(c)});
    var q=pickQ(old,S.lastKey);q.old=true;return q;
  }

}
async function askQuiz(n,chain){

(function(){
  var timer=0;
  function refresh(){
    var input=document.querySelector('#wa-invite');

    var error=document.createElement('p');error.style.color='#a33';error.hidden=true;error.textContent='QRコードを読み込めません。ネットワークの制限を確認してください。';
    img.onerror=function(){error.hidden=false};

  }
