<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Animated GIF: use the actual 512x512 image, not a spritesheet */
.mon.electric-mon{width:min(calc(var(--ms,120px)*1.65),100%);aspect-ratio:1/1;max-height:38vh;overflow:visible;border-radius:15px}
.mon.electric-mon .electric-sprite{display:block;width:100%;height:100%;object-fit:contain;border-radius:15px}
.mon.electric-mon.rage .electric-sprite{filter:saturate(1.3) brightness(1.12)}
.mon.electric-mon.hit{animation:shake .4s}
.mon.electric-mon.laugh{animation:bob .5s}
.mon.electric-mon.boom{animation:boom 1.1s forwards}
@media(prefers-reduced-motion:reduce){.mon.electric-mon.hit,.mon.electric-mon.laugh,.mon.electric-mon.boom{animation:none}}

/* All-stage illustrated monsters: full image contained, responsive, animated */
.mon.illustrated-mon{position:relative;width:min(calc(var(--ms,120px)*1.95),100%,36vh);aspect-ratio:1/1;overflow:visible;display:grid;place-items:center;transform-origin:50% 85%;animation:monster-breathe 2.3s ease-in-out infinite}
.mon.illustrated-mon .monster-portrait{width:100%;height:100%;object-fit:contain;display:block;border-radius:12px;filter:drop-shadow(0 5px 4px rgba(0,0,0,.15))}
.mon.illustrated-mon .monster-sweat,.mon.illustrated-mon .monster-pain{display:none;position:absolute;pointer-events:none}
.mon.illustrated-mon.exhausted{animation:monster-exhausted 1.3s ease-in-out infinite;transform-origin:50% 90%}
.mon.illustrated-mon.exhausted .monster-portrait{filter:saturate(.62) brightness(.84) drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.mon.illustrated-mon.exhausted .monster-sweat{display:block;right:4%;top:10%;font-size:clamp(20px,3vw,36px);animation:sweat-wobble 1.2s infinite}
.mon.illustrated-mon.exhausted .monster-pain{display:block;left:0;bottom:5%;background:#fff;border:2px solid #5c6671;color:#293746;border-radius:20px;padding:0 8px;font-size:clamp(11px,1.4vw,16px);font-weight:900;transform:rotate(-9deg)}
.mon.illustrated-mon.hit{animation:shake .4s}
.mon.illustrated-mon.laugh{animation:bob .5s}
.mon.illustrated-mon.boom{animation:boom 1.1s forwards}
@keyframes monster-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.025)}}
@keyframes monster-exhausted{0%,100%{transform:translateY(8px) rotate(-5deg) scale(.94)}50%{transform:translateY(12px) rotate(-7deg) scale(.92)}}
@keyframes sweat-wobble{50%{transform:translateY(8px) rotate(10deg)}}
@media(prefers-reduced-motion:reduce){.mon.illustrated-mon,.mon.illustrated-mon.exhausted{animation:none}}

/* Frame-animated characters, including a separate exhausted expression */
.mon.illustrated-mon .monster-portrait{mix-blend-mode:normal;object-fit:contain;border-radius:10px}
.mon.illustrated-mon.exhausted .monster-portrait{filter:none}

/* Final boss battle and optional finishing shot */
.battle.final-boss .arena{position:relative;isolation:isolate;border-radius:22px;background:radial-gradient(ellipse at 50% 42%,rgba(125,64,177,.25),rgba(34,23,61,.10) 52%,transparent 76%);padding:14px 10px 12px}
.battle.final-boss .arena:before{content:"";position:absolute;inset:7% 17% 15%;border:3px solid rgba(155,83,230,.55);border-radius:50%;box-shadow:0 0 28px 7px rgba(120,54,200,.25),inset 0 0 25px rgba(113,58,196,.2);z-index:-1;animation:boss-aura 3.2s ease-in-out infinite alternate}
.battle.final-boss .illustrated-mon{width:min(calc(var(--ms,120px)*2.2),100%,42vh);filter:drop-shadow(0 0 17px rgba(124,52,199,.55))}
.battle.final-boss .mname{font-size:clamp(20px,2.6vw,32px);color:#6923a5;text-shadow:0 1px #fff}
.boss-banner{font-family:var(--f-display);letter-spacing:.16em;font-size:clamp(13px,2vw,21px);font-weight:900;color:#8d29b0;text-align:center;text-shadow:0 1px 0 #fff}
.finish-row{width:100%;display:flex;justify-content:center;padding:4px 10px 12px}
.finish-btn{border:3px solid #8c2850;border-radius:16px;padding:12px 20px;background:linear-gradient(135deg,#ffdd62,#ff7845);color:#3a1733;font-weight:900;font-size:clamp(14px,2vw,19px);box-shadow:0 5px 0 #8c2850;cursor:pointer}
.finish-btn:disabled{opacity:.5;cursor:wait}
@keyframes boss-aura{from{transform:scale(.95) rotate(-4deg);opacity:.65}to{transform:scale(1.05) rotate(4deg);opacity:1}}
@media(prefers-reduced-motion:reduce){.battle.final-boss .arena:before{animation:none}}
.piercing-arrow svg{filter:drop-shadow(0 0 8px #54d7ff) drop-shadow(0 0 4px #54d7ff)}
.rainbow-arrow svg{filter:drop-shadow(0 0 9px #ff70ef) hue-rotate(105deg) saturate(2)}
.cell.bonus-item{outline:3px solid #ffd166;outline-offset:-4px;background:radial-gradient(circle,#fff3ad,#ffd76b 65%,#a87924)!important;animation:itemPulse 1.4s ease-in-out infinite}
.cell.bonus-item{font-size:clamp(15px,3.5vw,26px);cursor:grab}
@keyframes itemPulse{50%{filter:brightness(1.23);transform:scale(1.045)}}

}


/* Five-chain ally: appear over the enemy only during the boosted attack. */
.ally-attack-overlay{position:absolute;z-index:12;width:clamp(105px,18vw,230px);aspect-ratio:1/1;object-fit:contain;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 0 18px #69d9ff) drop-shadow(0 0 13px #ffdc68);will-change:transform,opacity}
.ally-attack-burst{position:absolute;z-index:11;width:clamp(130px,23vw,290px);aspect-ratio:1/1;border:5px solid #ffe287;border-radius:50%;box-shadow:0 0 24px #69d9ff, inset 0 0 22px #fff1a0;pointer-events:none;transform:translate(-50%,-50%);will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){.ally-attack-overlay,.ally-attack-burst{transition:none}}

たちは奈良へ修学旅行に行きました。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:002","stem":"Please ___ here. I will come back soon.","options":["wait","remember","wash","swim"],"answer":"wait","explanation":"wait：待つ。ここで待っていてください。すぐにもどります。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:003","stem":"The train will ___ at Tokyo at noon.","options":["arrive","invite","decide","hurry"],"answer":"arrive","explanation":"arrive：着く。電車は正午に東京に着きます。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:004","stem":"I will ___ you an e-mail tonight.","options":["send","swim","visit","forget"],"answer":"send","explanation":"send：送る。今夜あなたにメールを送ります。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:005","stem":"Can I ___ your pen?","options":["borrow","cook","decide","forget"],"answer":"borrow","explanation":"borrow：借りる。あなたのペンを借りてもいいですか。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:006","stem":"This singer is very ___ with young people.","options":["popular","tired","quiet","cheap"],"answer":"popular","explanation":"popular：人気のある。この歌手は若い人にとても人気があります。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:007","stem":"I cannot ___ what to eat for lunch.","options":["decide","explain","borrow","arrive"],"answer":"decide","explanation":"decide：決める。昼食に何を食べるか決められません。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:008","stem":"Students at my school wear a ___.","options":["uniform","vegetable","birthday","music"],"answer":"uniform","explanation":"uniform：制服。私の学校の生徒は制服を着ます。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:009","stem":"We climbed the ___ last summer.","options":["mountain","bakery","calendar","holiday"],"answer":"mountain","explanation":"mountain：山。私たちは去年の夏、山に登りました。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:010","stem":"The flowers in the park are very ___.","options":["beautiful","cheap","hungry","tired"],"answer":"beautiful","explanation":"beautiful：美しい。公園の花はとても美しいです。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:011","stem":"My father is a doctor at the ___.","options":["hospital","calendar","mountain","season"],"answer":"hospital","explanation":"hospital：病院。私の父は病院の医者です。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:012","stem":"I often swim in the ___ in summer.","options":["river","homework","mountain","airport"],"answer":"river","explanation":"river：川。私は夏によく川で泳ぎます。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:013","stem":"Today is my ___. I am twelve.","options":["birthday","music","bakery","station"],"answer":"birthday","explanation":"birthday：誕生日。今日は私の誕生日です。12才になります。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:014","stem":"The ___ grows rice and vegetables.","options":["farmer","message","breakfast","station"],"answer":"farmer","explanation":"farmer：農家の人。農家の人は米と野菜を育てます。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:015","stem":"The room is ___ because the heater is on.","options":["warm","difficult","cheap","dangerous"],"answer":"warm","explanation":"warm：暖かい。ヒーターがついているので、へやは暖かいです。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:016","stem":"I listen to ___ when I study.","options":["music","tomorrow","cousin","bicycle"],"answer":"music","explanation":"music：音楽。私は勉強するとき音楽を聞きます。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:017","stem":"A carrot is a ___.","options":["vegetable","cousin","message","umbrella"],"answer":"vegetable","explanation":"vegetable：野菜。にんじんは野菜です。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:018","stem":"I did not eat lunch, so I am ___.","options":["hungry","beautiful","dangerous","favorite"],"answer":"hungry","explanation":"hungry：おなかがすいた。昼食を食べなかったので、おなかがすいています。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:019","stem":"Today is Monday, so ___ is Tuesday.","options":["tomorrow","picture","teacher","pilot"],"answer":"tomorrow","explanation":"tomorrow：明日。今日は月曜日なので、明日は火曜日です。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:020","stem":"My dream is to ___ around the world.","options":["travel","send","remember","wash"],"answer":"travel","explanation":"travel：旅行する。私の夢は世界中を旅行することです。","difficulty":1},{"kind":"exam","mode":"e","id":"wa400:e:exam:021","stem":"Our team will ___ the soccer game tomorrow.","options":["win","decide","forget","swim"],"answer":"win","explanation":"win：勝つ。私たちのチームは明日のサッカーの試合に勝つでしょう。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:022","stem":"We saw old pictures at the ___.","options":["museum","singer","message","tomorrow"],"answer":"museum","explanation":"museum：博物館。私たちは博物館で古い絵を見ました。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:023","stem":"I sleep in my ___ every night.","options":["bedroom","hospital","trip","calendar"],"answer":"bedroom","explanation":"bedroom：寝室。私は毎晩、寝室でねます。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:024","stem":"My father will ___ dinner tonight.","options":["cook","arrive","draw","wear"],"answer":"cook","explanation":"cook：料理する。今夜は父が夕食を作ります。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:025","stem":"I ran to ___ the last train.","options":["catch","believe","swim","invite"],"answer":"catch","explanation":"catch：つかまえる。私は最終電車に間に合うように走りました。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:026","stem":"My mother is cooking lunch in the ___.","options":["kitchen","garden","restaurant","museum"],"answer":"kitchen","explanation":"kitchen：台所。母は台所で昼食を作っています。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:027","stem":"My mother was ___ because I broke the window.","options":["angry","popular","warm","dangerous"],"answer":"angry","explanation":"angry：おこった。窓をわったので、母はおこりました。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:028","stem":"We have a long ___ in August.","options":["holiday","river","bicycle","lesson"],"answer":"holiday","explanation":"holiday：休日。私たちは8月に長い休みがあります。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:029","stem":"I sent a ___ to my friend by phone.","options":["message","museum","forest","trip"],"answer":"message","explanation":"message：メッセージ。私は友だちに電話でメッセージを送りました。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:030","stem":"It is raining. Take your ___.","options":["umbrella","station","hospital","classroom"],"answer":"umbrella","explanation":"umbrella：かさ。雨が降っています。かさを持っていきなさい。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:031","stem":"I read an ___ story about space.","options":["interesting","expensive","dangerous","tired"],"answer":"interesting","explanation":"interesting：おもしろい。私は宇宙についてのおもしろい話を読みました。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:032","stem":"I borrowed this book from the ___.","options":["library","mountain","homework","pilot"],"answer":"library","explanation":"library：図書館。私はこの本を図書館で借りました。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:033","stem":"I ___ you. You are my best friend.","options":["believe","wash","swim","enjoy"],"answer":"believe","explanation":"believe：信じる。私はあなたを信じています。あなたは私の親友です。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:034","stem":"Do not ___ to bring your lunch box.","options":["forget","believe","catch","borrow"],"answer":"forget","explanation":"forget：忘れる。お弁当を持ってくるのを忘れないで。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:035","stem":"We must ___, or we will miss the train.","options":["hurry","practice","send","travel"],"answer":"hurry","explanation":"hurry：急ぐ。急がないと、電車に乗りおくれます。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:036","stem":"I cannot ___ his name, but I know his face.","options":["remember","swim","explain","wash"],"answer":"remember","explanation":"remember：覚えている。彼の名前は思い出せませんが、顔は知っています。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:037","stem":"I can ___ fast in the pool.","options":["swim","win","travel","believe"],"answer":"swim","explanation":"swim：泳ぐ。私はプールで速く泳げます。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:038","stem":"Many birds live in the ___.","options":["forest","farmer","pilot","vegetable"],"answer":"forest","explanation":"forest：森。たくさんの鳥が森に住んでいます。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:039","stem":"I have a lot of ___ today, so I cannot play.","options":["homework","hotel","vegetable","airport"],"answer":"homework","explanation":"homework：宿題。今日は宿題がたくさんあるので、遊べません。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:040","stem":"I went to bed late, so I am ___ this morning.","options":["tired","quiet","cheap","favorite"],"answer":"tired","explanation":"tired：つかれた。ねるのがおそかったので、今朝はつかれています。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:041","stem":"There are many flowers in our ___.","options":["garden","vegetable","message","mountain"],"answer":"garden","explanation":"garden：庭。私たちの庭にはたくさんの花があります。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:042","stem":"Hawaii is a beautiful ___ in the Pacific Ocean.","options":["island","dessert","forest","kitchen"],"answer":"island","explanation":"island：島。ハワイは太平洋にある美しい島です。","difficulty":2},{"kind":"exam","mode":"e","id":"wa400:e:exam:043","stem":"The ___ is sunny today.","options":["weather","lesson","garden","station"],"answer":"weather","explanation":"weather：天気。今日の天気は晴れです。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:044","stem":"I looked up the word in my ___.","options":["dictionary","birthday","museum","picture"],"answer":"dictionary","explanation":"dictionary：辞書。私はその単語を辞書で調べました。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:045","stem":"She likes to ___ pictures of animals.","options":["draw","send","believe","sing"],"answer":"draw","explanation":"draw：描く。彼女は動物の絵をかくのが好きです。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:046","stem":"We have an English ___ every Friday.","options":["lesson","farmer","dictionary","cousin"],"answer":"lesson","explanation":"lesson：授業。私たちは毎週金曜日に英語の授業があります。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:047","stem":"This math question is ___ for me.","options":["difficult","cheap","warm","beautiful"],"answer":"difficult","explanation":"difficult：難しい。この算数の問題は私には難しいです。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:048","stem":"Can you help me ___ this heavy box upstairs?","options":["carry","borrow","wear","draw"],"answer":"carry","explanation":"carry：運ぶ。この重い箱を2階に運ぶのを手伝ってくれますか。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:049","stem":"I will ___ my grandmother in Osaka this Sunday.","options":["visit","hurry","believe","cook"],"answer":"visit","explanation":"visit：訪ねる。今度の日曜日に大阪の祖母を訪ねるつもりです。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:050","stem":"We had ice cream for ___ after dinner.","options":["dessert","hospital","dictionary","cousin"],"answer":"dessert","explanation":"dessert：デザート。夕食のあと、デザートにアイスクリームを食べました。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:051","stem":"Please ___ your hands before dinner.","options":["wash","practice","forget","draw"],"answer":"wash","explanation":"wash：洗う。夕食の前に手を洗ってください。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:052","stem":"I go to school by ___.","options":["bicycle","message","kitchen","ticket"],"answer":"bicycle","explanation":"bicycle：自転車。私は自転車で学校に行きます。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:053","stem":"We bought some bread at the ___.","options":["bakery","hospital","singer","lesson"],"answer":"bakery","explanation":"bakery：パン屋。私たちはパン屋でパンを買いました。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:054","stem":"Please be ___ in the library. People are reading.","options":["quiet","beautiful","wonderful","warm"],"answer":"quiet","explanation":"quiet：静かな。図書館では静かにしてください。人々が読書しています。","difficulty":3},{"kind":"exam","mode":"e","id":"wa400:e:exam:055","stem":"I want to __ /* a "plan" is the random set of cards for each of the 10 stages; it is saved so a game can be continued */
/* 8 unique study cards per stage; rotate the least-used cards between new runs. */
function makeWorldPlan(){
  var history=lsj('wordarrow-world-usage',{}),progress=lsj('wordarrow-world-accuracy',[]),recent=progress.slice(-20),accuracy=recent.length?recent.filter(Boolean).length/recent.length:0.65;
  var target=recent.length<10?2:accuracy>=.8?3:accuracy<.5?1:2;
  var plan=[];
  for(var stage=0;stage<10;stage++){
    var era=['古代','中世','近世','近代','現代'][Math.floor(stage/2)];
    var pool=shuffle(WA_WORLD_QUESTIONS.filter(function(x){return x.era===era}));
    pool.sort(function(a,b){var da=Math.abs(a.level-target),db=Math.abs(b.level-target);return da-db||(history[a.id]||0)-(history[b.id]||0)});
    var cards=pool.slice(0,8);cards.forEach(function(x){history[x.id]=(history[x.id]||0)+1});plan.push(cards.map(function(x){return x.id}));
  }
  lsw('wordarrow-world-usage',history);return plan;
}
function makePlan(m){
  if(m==='wh')return makeWorldPlan();
  var pool=Object.keys(BYID).map(function(id){return BYID[id]}).filter(function(c){return c.mode===m&&variants(c).length});
  var history=lsj('wordarrow-plan-count-v3-'+m,{});
  var recent=lsj('wordarrow-recent-v4-'+m,[]).slice(-30);
  var performance=lsj('wordarrow-performance-v4-'+m,{});
  var recentMap={};recent.forEach(function(id){recentMap[id]=1});
  function score(c){
    var p=performance[c.id]||{ok:0,ng:0},total=p.ok+p.ng,rate=total?p.ok/total:.65;
    var level=c.item&&c.item.difficulty||2;
    var desired=rate>=.8?3:rate<.5?1:2;
    return (history[c.id]||0)*3+Math.abs(level-desired)*1.8+(recentMap[c.id]?10000:0)+Math.random()*2;
  }
  var order=pool.filter(function(c){return c.kind==='order'}).sort(function(a,b){return score(a)-score(b)});
  var other=pool.filter(function(c){return c.kind!=='order'}).sort(function(a,b){return score(a)-score(b)});
  var selected=[],orderTarget=(m==='e'||m==='e5')?32:0;
  // 4 of 10 questions are sentence ordering: 32 of 80 study cards (40%).
  var oi=0,ni=0;
  for(var i=0;i<80;i++){
    var useOrder=orderTarget>0&&(i%10<4)&&oi<order.length;
    var c=useOrder?order[oi++]:other[ni++];
    if(!c)c=order[oi++]||other[ni++];
    if(c){selected.push(c);history[c.id]=(history[c.id]||0)+1}
  }
  lsw('wordarrow-plan-count-v3-'+m,history);
  var plan=[];
  for(var st=0;st<10;st++)plan.push(selected.slice(st*8,(st+1)*8).map(function(c){return c.id}));
  return plan;
}

var speechVoices=[];
function refreshSpeechVoices(){
  try{speechVoices=window.speechSynthesis.getVoices()||[]}catch(e){speechVoices=[]}
}
function preferredSpeechVoice(lang){
  refreshSpeechVoices();
  var target=(lang||'en-US').toLowerCase();
  var primary=target.split('-')[0];
  var candidates=speechVoices.filter(function(v){return v.lang&&v.lang.toLowerCase().split('-')[0]===primary});
  if(!candidates.length)return null;
  function rank(v){
    var code=v.lang.toLowerCase(),name=v.name||'',score=0;
    if(code===target)score+=100;
    else if(code.split('-')[0]===primary)score+=25;
    if(/premium|enhanced|neural|natural/i.test(name))score+=45;
    if(/samantha|ava|allison|susan|alex|daniel|serena|google us english|microsoft aria|microsoft jenny/i.test(name))score+=15;
    if(/compact|eloquence|novelty|robot|whisper|bad news|good news|bubbles/i.test(name))score-=80;
    return score;
  }
  candidates.sort(function(a,b){return rank(b)-rank(a)});
  return candidates[0];
}

/* English word audio: real dictionary recordings when available.
   Example sentences: optional hosted audio assets; otherwise device TTS.
   No API keys are required. */
var wordAudioCache=Object.create(null);
var currentAudio=null;
var playbackSerial=0;
function stopAudio(){
  playbackSerial++;

  if('speechSynthesis' in window)window.speechSynthesis.cancel();
}
function speechFallback(t,locale){
  if(!('speechSynthesis' in window))return;
  var u=new SpeechSynthesisUtterance(String(t));
  u.lang=locale;
  u.rate=locale==='ja-JP'?0.9:0.94;
  u.pitch=1;
  u.volume=1;
  var voice=preferredSpeechVoice(locale);
  if(voice)u.voice=voice;
  window.speechSynthesis.speak(u);
}
async function getDictionaryAudio(word){
  var key=word.toLowerCase();
  if(Object.prototype.hasOwnProperty.call(wordAudioCache,key))return wordAudioCache[key];
  try{
    var controller=new AbortController();
    var timeout=setTimeout(function(){controller.abort()},3500);
    var response;
    try{response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key),{signal:controller.signal})}
    finally{clearTimeout(timeout)}
    if(!response.ok)throw new Error('No dictionary audio');
    var entries=await response.json(),audio='';
    for(var entry of entries){
      for(var phonetic of (entry.phonetics||[])){
        if(phonetic.audio){
          var url=new URL(phonetic.audio,location.href);
          if(url.protocol==='https:'){
            if(!audio||/us/i.test(url.pathname))audio=url.href;
            if(/us/i.test(url.pathname))break;
          }
        }
      }
      if(audio)break;
    }
    wordAudioCache[key]=audio||null;
  }catch(e){wordAudioCache[key]=null}
  return wordAudioCache[key];
}
function playAudioUrl(url,serial,fallback){
  if(serial!==playbackSerial)return;
  var audio=new Audio(url);
  currentAudio=audio;
  audio.onended=function(){if(currentAudio===audio)currentAudio=null};
  audio.onerror=function(){if(serial===playbackSerial){currentAudio=null;fallback()}};
  var result=audio.play();
  if(result&&result.catch)result.catch(function(){if(serial===playbackSerial){currentAudio=null;fallback()}});
}
async function speak(t,lang){
  if(!t)return;
  stopAudio();
  var serial=playbackSerial,locale=lang||'en-US';
  // The pronoun I is pronounced /aɪ/. Avoid ambiguous single-letter dictionary recordings.
  if(locale==='en-US' && String(t).trim()==='I'){speechFallback('eye',locale);return;}
  var fallback=function(){if(serial===playbackSerial)speechFallback(t,locale)};
  if(locale==='en-US'){
    var clean=String(t).trim();
    if(/^[a-z]+(?:[-'][a-z]+)*$/i.test(clean)){
      var recording=await getDictionaryAudio(clean);
      if(serial!==playbackSerial)return;
      if(recording){playAudioUrl(recording,serial,fallback);return}
    }else{
      // To use studio-recorded sentence audio, add files and a mapping
      // to window.WORD_ARROW_SENTENCE_AUDIO before this script executes.
      var mapping=window.WORD_ARROW_SENTENCE_AUDIO||{};
      var url=mapping[clean];
      if(typeof url==='string'&&/^(https:\/\/|\.\/?)/.test(url)){
        playAudioUrl(url,serial,fallback);return;
      }
    }
  }
  fallback();
}

var SIMPLE=['横','縦','左払い','右払い','点'];
function classify(pts,w){
  var a=pts[0],b=pts[pts.length-1],dx=b.x-a.x,dy=b.y-a.y,pl=0,i;
  for(i=1;i<pts.length;i++){var ex=pts[i].x-pts[i-1].x,ey=pts[i].y-pts[i-1].y;pl+=Math.sqrt(ex*ex+ey*ey)}
  if(pl<w*.09) return '点';
  var ang=Math.atan2(dy,dx)*180/Math.PI;
  if(ang>-30&&ang<=28) return '横';
  if(ang>75&&ang<=105) return '縦';
  if(ang>28&&ang<=75) return '右払い';
  if(ang>105) return '左払い';
  return '?';
}
function initPad(cv){
  var ctx=cv.getContext('2d'),strokes=[],cur=null,locked=false,dpr=window.devicePixelRatio||1;
  function paint(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(6,cv.clientWidth/34);ctx.strokeStyle=getComputedStyle(cv).color;
    strokes.forEach(function(s){
      ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);
      if(s.length===1) ctx.lineTo(s[0].x+.01,s[0].y);
      for(var i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y);
      ctx.stroke();
    });
  }
  function pt(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);
  cv.addEventListener('pointerdown',function(e){if(locked)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}cur=[pt(e)];strokes.push(cur);paint()});
  cv.addEventListener('pointermove',function(e){if(!cur)return;cur.push(pt(e));paint()});
  function end(){cur=null}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  paint();
  return {strokes:function(){return strokes},clear:function(){strokes.length=0;paint()},undo:function(){strokes.pop();paint()},lock:function(){locked=true},width:function(){return cv.clientWidth}};
}

function allCards(kind){return Object.keys(BYID).map(function(id){return BYID[id]}).filter(function(x){return x.kind===kind})}
function edistract(c,field){
  var seen={};seen[c[field]]=1;var out=[];
  shuffle(allCards('e').filter(function(x){return x!==c&&x.pos===c.pos&&x.mode===c.mode})).forEach(function(x){
    if(out.length<3&&!seen[x[field]]){seen[x[field]]=1;out.push(x)}
  });
  return out;
}
function misspell(w){
  var seen={},res=[],tries=0,V='aeiou';
  while(res.length<3&&tries<80){
    tries++;
    var a=w.split(''),t=Math.floor(Math.random()*4),i=1+Math.floor(Math.random()*Math.max(1,a.length-2)),r;
    if(t===0){if(i>=a.length-1)continue;var x=a[i];a[i]=a[i+1];a[i+1]=x}
    else if(t===1){a.splice(i,1)}
    else if(t===2){a.splice(i,0,a[i])}
    else{
      var js=[];a.forEach(function(ch,k){if(k>0&&V.indexOf(ch)>=0)js.push(k)});
      if(!js.length) continue;
      var j=js[Math.floor(Math.random()*js.length)];
      a[j]=V.charAt((V.indexOf(a[j])+1+Math.floor(Math.random()*4))%5);
    }
    r=a.join('');
    if(r!==w&&!seen[r]){seen[r]=1;res.push(r)}
  }
  while(res.length<3) res.push(w+'e'.repeat(res.length+1));
  return res;
}

/* ---------- board logic ---------- */
function findMatches(){
  var s={},b=S.b,r,c,t;
  function at(r,c){return b[r]&&b[r][c]?b[r][c].t:-9}
  for(r=0;r<N;r++)for(c=0;c<N-2;c++){t=at(r,c);if(t>=0&&at(r,c+1)===t&&at(r,c+2)===t){s[r+','+c]=1;s[r+','+(c+1)]=1;s[r+','+(c+2)]=1}}
  for(c=0;c<N;c++)for(r=0;r<N-2;r++){t=at(r,c);if(t>=0&&at(r+1,c)===t&&at(r+2,c)===t){s[r+','+c]=1;s[(r+1)+','+c]=1;s[(r+2)+','+c]=1}}
  return Object.keys(s);
}
/* Special arrows: 4-in-a-row => piercing; 5+ => rainbow.
   Count uninterrupted runs before clearing, including cascades.
   A run of five awards only rainbow, not both rewards. */
function specialMatches(){
  var four=0,five=0,b=S.b;
  function at(r,c){return b[r]&&b[r][c]?b[r][c].t:-9}
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var t=at(r,c);if(t<0)continue;
    if(c===0||at(r,c-1)!==t){
      var h=1;while(c+h<N&&at(r,c+h)===t)h++;
      if(h>=5)five++;else if(h===4)four++;
    }
    if(r===0||at(r-1,c)!==t){
      var v=1;while(r+v<N&&at(r+v,c)===t)v++;
      if(v>=5)five++;else if(v===4)four++;
    }
  }
  return {four:four,five:five};
}
function hasMoves(){
  var b=S.b;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var d=[[0,1],[1,0]];
    for(var k=0;k<2;k++){
      var r2=r+d[k][0],c2=c+d[k][1]; if(r2>=N||c2>=N) continue;
      var A=b[r][c],B=b[r2][c2]; if(A.t<0||B.t<0) continue;
      b[r][c]=B;b[r2][c2]=A; var m=findMatches().length>0; b[r][c]=A;b[r2][c2]=B;
      if(m) return true;
    }
  }
  return false;
}
function fillQ(c){while(S.q[c].length<3)S.q[c].push(rnd())}
function newBoard(){
  var tries=0;
  do{
    S.b=[];
    for(var r=0;r<N;r++){S.b[r]=[];for(var c=0;c<N;c++){
      var t;do{t=rnd()}while((c>=2&&S.b[r][c-1].t===t&&S.b[r][c-2].t===t)||(r>=2&&S.b[r-1][c].t===t&&S.b[r-2][c].t===t));
      S.b[r][c]={t:t,f:0};}}
    tries++;
  }while(!hasMoves()&&tries<50);
  S.q=[];for(var q=0;q<N;q++){S.q[q]=[];fillQ(q)}
}
function reshuffle(){
  var tries=0,cells=[],r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(S.b[r][c].t>=0)cells.push(S.b[r][c]);
  do{
    var ts=shuffle(cells.map(function(x){return x.t})),i=0;
    cells.forEach(function(x){x.t=ts[i++]});
    tries++;
  }while((findMatches().length||!hasMoves())&&tries<60);
}
function jamaCount(){var n=0;for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(S.b[r][c]&&S.b[r][c].t<0)n++;return n}
// Standard assist: in 40% of refill events, try to place ONE color
// which completes a real 3-match. If no legal candidate exists, refill normally.
function assistRefill(holes,chainDepth){
 var chance=(S.feverMoves>0?.96:chainDepth>=7?.88:chainDepth>=5?.78:chainDepth>=3?.68:.55);
 if(!holes.length||Math.random()>=chance)return false;
 var choices=[],b=S.b;
 function at(r,c){return r>=0&&r<N&&c>=0&&c<N&&b[r][c]?b[r][c].t:-9}
 holes.forEach(function(p){var r=p[0],c=p[1],cell=b[r][c];
  for(var t=0;t<5;t++){
   var horiz=(at(r,c-2)===t&&at(r,c-1)===t)||(at(r,c-1)===t&&at(r,c+1)===t)||(at(r,c+1)===t&&at(r,c+2)===t);
   var vert=(at(r-2,c)===t&&at(r-1,c)===t)||(at(r-1,c)===t&&at(r+1,c)===t)||(at(r+1,c)===t&&at(r+2,c)===t);
   if((horiz||vert)&&cell.t!==t)choices.push({r:r,c:c,t:t});
  }
 });
 if(!choices.length)return false;
 var pick=choices[Math.floor(Math.random()*choices.length)];b[pick.r][pick.c].t=pick.t;
 return true;
}
function gravity(chainDepth){
  var holes=[];
  for(var c=0;c<N;c++){
    var w=N-1,r;
    for(r=N-1;r>=0;r--){
      var cell=S.b[r][c];
      if(cell){ if(w!==r){S.b[w][c]=cell;S.b[r][c]=null;cell.f=w-r} w--; }
    }
    for(r=w;r>=0;r--){S.b[r][c]={t:S.q[c].shift(),f:w+1};holes.push([r,c]);fillQ(c)}
  }
  assistRefill(holes,chainDepth||0);
  if(S.feverMoves>0)assistRefill(holes,chainDepth||0);
}
function renderPv(){
  var pv=$('#pv'); if(!pv||!S.q) return;
  var h='',row,c;
  for(row=1;row>=0;row--)for(c=0;c<N;c++){h+='<div class="pcell'+(row?' far':'')+'">'+gem(S.q[c][row])+'</div>'}
  pv.innerHTML=h;
}
function render(clr){
  board.innerHTML='';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var cell=S.b[r][c],el=document.createElement('button');
    el.type='button';

function onMove(e){

/* 3 puzzle rounds are added up (P) and their combo bonuses are multiplied (M, capped) */
function chargeStat(){
  var P=0,M=1,tn=0;
  S.charge.forEach(function(m){
    P+=m.n*4*(m.ok?1:.25)+(m.bonus||0);
    // Special arrows are earned by matching; quiz accuracy still scales the damage.
    P+=((m.special4||0)*16+(m.special5||0)*36)*(m.ok?1:.25);
    M*=1+.2*(m.chain-1)+.04*Math.max(0,m.n-3);
    tn+=m.n;
  });
  return {P:P,M:Math.min(3,M),tn:tn,four:S.charge.reduce(function(a,m){return a+(m.special4||0)},0),five:S.charge.reduce(function(a,m){return a+(m.special5||0)},0)};
}

  if(potential<S.hp)return;
  S.locked=true;updateInfo();
  await fire();S.charge=[];
  if(S.hp<=0){await victory();return;}
  updateInfo();S.locked=false;
}

var waSpellSeen={e:{},e5:{}};
function waSpellCandidate(){
  var mode=S.mode;
  if(mode!=='e'&&mode!=='e5')return null;
  var min=mode==='e5'?3:5,max=mode==='e5'?6:9;
  var pool=allCards('e').filter(function(c){return c.mode===mode&&/^[a-z]+$/i.test(c.en||'')&&c.en.length>=min&&c.en.length<=max&&c.ja});
  if(!pool.length)return null;
  var seen=waSpellSeen[mode]||(waSpellSeen[mode]={});
  var fresh=pool.filter(function(c){return !seen[c.en.toLowerCase()]});
  if(!fresh.length){waSpellSeen[mode]=seen={};fresh=pool}
  var card=fresh[Math.floor(Math.random()*fresh.length)];seen[card.en.toLowerCase()]=true;
  return card;
}
function waSpellPoints(mode,len){return mode==='e5'?(len<=4?200:300):(len<=6?400:500)}
function waSpellShuffle(word){
  var original=word.toLowerCase().split(''),letters=original.slice();
  for(var attempt=0;attempt<15;attempt++){

  t.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(-8deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.25) rotate(-4deg)',opacity:1,offset:.35},{transform:'translate(-50%,-50%) scale(1) rotate(-4deg)',opacity:1}],{duration:700,easing:'ease-out',fill:'forwards'});
  await sleep(1900);
  showReview(false,{});
}

/* ---------- review ---------- */
function showReview(retested,rt){
  var st=stages()[S.stage]; window.scrollTo(0,0);
  var missed=st.cards.filter(function(c){return S.stat[c.id]&&S.stat[c.id].ng>0});
  var rows=st.cards.slice().sort(function(a,b){return (S.stat[b.id]?S.stat[b.id].ng:0)-(S.stat[a.id]?S.stat[a.id].ng:0)}).map(function(c){
    var s=S.stat[c.id]||{ng:0},bad=s.ng>0,badge;
    if(retested&&rt[c.id]!==undefined) badge=rt[c.id]?'<span class="badge">復習OK</span>':'<span class="badge ng">もう一度見直そう</span>';
    else badge=bad?'<span class="badge ng">まちがい '+s.ng+'回</span>':'<span class="badge">ばっちり</span>';
    return cardHTML(c,{badge:badge,miss:bad});
  }).join('');
  var last=S.stage>=9;
  var btns='';
  if(missed.length&&!retested) btns+='<button type="button" class="btn primary" id="rt">まちがえた'+missed.length+'枚をテスト</button><button type="button" class="btn ghost" id="nx">そのまま進む</button>';
  else btns+='<button type="button" class="btn primary" id="nx">'+(last?'けっかを見る':'STAGE '+(S.stage+2)+'へ')+'</button>';
  if(!last) btns+='<button type="button" class="btn ghost" id="quit">ここでやめて記録する</button>';
  app.innerHTML=
  '<section><div class="head"><p class="eyebrow">STAGE '+(S.stage+1)+' クリア</p><h2>'+MONS[S.stage].name+'を倒した！</h2>'+
  '<p class="lead">'+(missed.length?'まちがえたカードを上にならべました。まちがいノートにも残っています。':'すべてのカードに、まよわず正解できました。')+'</p></div>'+
  '<div class="rv">'+rows+'</div><div class="actions" style="max-width:520px">'+btns+'</div></section>';
  bindSay(app);
  $('#nx').onclick=function(){
    S.stage++;
    if(S.stage>=10){progSet(S.mode,0);showFinal(10)}else showStudy(S.stage);
  };
  var q=$('#quit');if(q) q.onclick=function(){showFinal(S.stage+1)};
  var rb=$('#rt');if(rb) rb.onclick=async function(){var r=await runTest(missed,{});showReview(true,r)};
}

function showFinal(cleared){
  window.scrollTo(0,0);
  var m=S.mode,tot=S.tot.ok+S.tot.ng,acc=tot?Math.round(100*S.tot.ok/tot):0,done=cleared>=10;
  var ms=Object.keys(S.miss).filter(function(id){return BYID[id]}).sort(function(a,b){return S.miss[b]-S.miss[a]}).slice(0,6);
  var rk=RK[m],best=rk.length?rk[0].score:0;
  var qual=S.score>0&&(m==='wh'||rk.length<5||S.score>rk[rk.length-1].score),isBest=S.score>best&&S.score>0;
  var lastName=lsj('wordarrow-name','');
  var saved=false;
  if(done) SFX.fan();
  app.innerHTML=
  '<section><div class="head"><p class="eyebrow">'+MODE_NAME[m]+'　STAGE '+cleared+' まで到達</p><h2>'+(done?MONS[9].name+'を倒した！':'ここまでの記録')+'</h2></div>'+
  '<div class="sum"><div class="bignum">'+S.score+'<small style="font-size:.4em"> pt</small></div><p class="lead">'+S.tot.ok+'問正解 / '+tot+'問（正答率 '+acc+'%）</p></div>'+
  (qual?'<div class="namebox" id="nbox"><div class="verdict ok">'+(isBest?'最高記録を更新！':'ランクイン！')+'</div><label for="nm">名前を残そう</label><input id="nm" maxlength="10" autocomplete="off" value="'+esc(lastName)+'" placeholder="10文字まで"><button type="button" class="btn primary" id="save">記録する</button></div>':'')+
  '<div id="rkbox"><p class="sec">'+MODE_NAME[m]+'のランキング（この端末）</p>'+rkHTML(m,-1)+'</div>'+
  (m==='wh'?'<div id="wa-world-ranking-result"></div>':'')+
  (ms.length?'<p class="sec">まちがいが多かった問題</p><div class="rv">'+ms.map(function(id){return cardHTML(BYID[id],{badge:'<span class="badge ng">'+S.miss[id]+'回</span>',miss:1})}).join('')+'</div>':'<p class="lead" style="margin-bottom:16px">1問もまちがえませんでした。</p>')+
  '<div class="actions two" style="max-width:520px"><button type="button" class="btn ghost" id="nbb">まちがいノート</button><button type="button" class="btn primary" id="again">タイトルへ</button></div></section>';
  bindSay(app);
  if(m==='wh' && window.WAWorldOnline)window.WAWorldOnline.render('wa-world-ranking-result');
  if(m!=='wh' && window.WAOnline && window.WAOnline.submitNormalScore){
    window.WAOnline.submitNormalScore({subject:({e:'eiken4',k:'kanken4',e5:'eiken5',k5:'kanken5'})[m],score:S.score,stages:cleared,correct:S.tot.ok,total:tot}).catch(function(e){console.warn('Online score sync failed:',e)});
  }
  var sv=$('#save');
  if(sv) sv.onclick=function(){
    if(saved) return; saved=true;
    var nm=($('#nm').value||'').trim().slice(0,10)||'ななし';
    lsw('wordarrow-name',nm);
    var d=new Date(),entry={name:nm,score:S.score,stages:cleared,date:d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};
    RK[m].push(entry);
    RK[m].sort(function(a,b){return b.score-a.score});
    RK[m]=RK[m].slice(0,5);lsw('wordarrow-rank-'+m,RK[m]);
    var hi=RK[m].indexOf(entry);
    $('#nbox').innerHTML='<div class="verdict ok">記録しました！</div>';
    $('#rkbox').innerHTML='<p class="sec">'+MODE_NAME[m]+'のランキング</p>'+rkHTML(m,hi);
    SFX.good();
    if(m==='wh' && window.WAWorldOnline){
      var box=document.createElement('div');box.id='wa-world-save-status';box.style.cssText='margin:12px 0;font-weight:800';
      $('#rkbox').prepend(box);box.textContent='🌍 みんなのランキングに送信中…';
      window.WAWorldOnline.submit({nickname:nm,score:S.score,stages:cleared,correct:S.tot.ok,total:tot}).then(function(){box.textContent='🌍 世界史のポイントを共有しました！';window.WAWorldOnline.render('wa-world-ranking-result')}).catch(function(e){box.textContent='オンライン送信に失敗しました：'+e.message+'（端末内の記録は保存済み）'});
    }
  };
  $('#nbb').onclick=function(){showNotebook(m)};
  $('#again').onclick=showTitle;
}

// Expose read-only question pools to the separate 10-question module.
window.WA_TEN_DATA={
  EPOOL:EPOOL, E5_POOL:E5_POOL, KJ:KJ, K5_POOL:K5_POOL,
  WA_EXAM_ITEMS:WA_EXAM_ITEMS, WA_WORLD_QUESTIONS:WA_WORLD_QUESTIONS
};
showTitle();
})();
</script>
